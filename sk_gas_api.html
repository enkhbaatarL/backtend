n\n<details>\n  <summary><strong>v1.2.5 (2026-06-17)</strong></summary>\n\n- [Scenario Group]\n  - 그룹 그래프에 MI Base 기준선(`baseSeries`) 추가 (`exec_type_cd=MI_BASE` 최신 케이스, run_seq 기준 최신 가격)\n  - 그래프 시리즈에 `status`(판정상태/폐기여부) · `modelRunning`(수급모델 실행중) 필드 추가\n  - 그룹 삭제 시 하위 시나리오 + signpost 까지 함께 soft-delete (기존: signpost 제외)\n- [Scenario Design — 신규 도메인]\n  - 설계 시작/상태 조회/분기항목 템플릿/검토 요청/Signpost 생성/확정/초기화 API 추가 (진행 단계 SSE 알림)\n  - 데이터 소스 현황에 시나리오 설계 섹션 추가\n- [Event]\n  - 이벤트 설계가능 조회 API 추가, 목록/상세에 라이브 설계 상태(설계중/설계완료) 반영\n\n</details>\n\n<details>\n  <summary><strong>v1.2.4 (2026-06-16)</strong></summary>\n\n- [Fundamental Model]\n  - Mock 인프라 전체 철거: 모든 Fundamental Model Case/Run API를 DB(real) 구현으로 단일화\n  - Mock 서비스(`FundamentalModelCaseMockService`) · 라우팅 델리게이터(`FundamentalModelCaseServiceDelegator`) · Mock 토글 설정(`FundamentalModelMockProperties`, `mi.fundamental-model.mock.*`) 제거\n  - [Mock 전용] Case 데이터 초기화 API(`POST .../fundamental-model/cases/reset`) 삭제 (데이터 소스 현황에서도 제외)\n  - 앱 기동 시 mock seed 로딩 제거\n\n</details>\n\n<details>\n<summary><strong>v1.2.3 (2026-06-11)</strong></summary>\n\n- [Model Execution]\n  - Price chart에 monthly/yearly series 필드 분리 추가\n- [Scenario Group]\n  - 시나리오 상태 변경 시 그룹 status 재도출 (실현 시나리오 존재 시 realized, 실현 되돌림 시 created 환원)\n\n</details>\n\n<details>\n<summary><strong>v1.2.2 (2026-06-11)</strong></summary>\n\n- [Scenario Group]\n  - 적용 완료된 DB schema(`04_incremental_apply_2506111441.sql`) 기준으로 Scenario 상태 매핑 정리\n  - 삭제 컬럼(`feasibility_score`, `probability_level`, `judgment_status_code`) 참조 제거\n  - 신규 `tmm_mi_scenario_m.status` 기반으로 시나리오 상태 조회/변경 처리\n  - 외부 API 상태 계약은 기존 `pending` / `realized` / `discarded` 유지\n  - DB 상태값 호환 매핑: `creating` / `created` / null / blank → `pending`, `realized` → `realized`, `discarded` → `discarded`\n  - 상태 변경 저장 매핑: `pending` → DB `created`, `realized` → DB `realized`, `discarded` → DB `discarded`\n  - 폐기 시나리오 확률 재분배 기준을 신규 DB `status = discarded`로 변경\n\n</details>\n\n<details>\n<summary><strong>v1.2.1 (2026-06-10)</strong></summary>\n\n- [Overview / Scenario / Design]\n  - AS-IS API(Deprecated) 모두 삭제\n\n</details>\n\n<details>\n<summary><strong>v1.1.11 (2026-06-09)</strong></summary>\n\n- [Scenario Group]\n  - 시나리오 판정 상태 일괄 변경 API 추가\n  - 시나리오 그룹 삭제 API 추가\n\n</details>\n\n<details>\n<summary><strong>v1.1.10 (2026-06-09)</strong></summary>\n\n- [Model Execution]\n  - 수급모델 실행 요청: parameter(JSON) 기반 → 입력 파일 3개 multipart 업로드 방식으로 변경\n    - 요청 형식 `application/json` → `multipart/form-data` (`files` 파트, 입력 파일 3개)\n    - 요청 DTO(`ModelExecutionSubmitReq` · `ModelExecutionTableReq` · `ModelExecutionTableRowReq`) 제거\n  - 실행 접수 응답 / 실행 상태 응답에 업로드 파일 메타데이터 `files[]` 추가\n    - `fileNo`(DB `tcm_filel.file_no` 매핑) · `fileIndex` · `originalFileName` · `contentType` · `size`\n  - [Mock 전용] 수급모델 실행 데이터 초기화 API(`POST .../model-executions/reset`)를 데이터 소스 현황에 추가\n\n</details>\n\n<details>\n<summary><strong>v1.1.0 (2026-06-04)</strong></summary>\n\n- [Scenario Group — 신규 도메인]\n  - 시나리오 그룹 목록(그룹 모드) / 개별 시나리오 목록(개별 모드) API 추가\n  - 그룹 가격전망 그래프(단일 인덱스, `indexName`) / 그래프 엑셀 다운로드(전 인덱스 시트) API 추가\n  - 시나리오 그룹 상세(요약 + 가정·실행가능성 표) / 개별 시나리오 상세(내러티브 · 주요 가정 · Signpost) API 추가\n  - 시나리오 판정 상태 변경 API 추가 (대기 `pending` / 실현 `realized` / 폐기 `discarded`, PATCH)\n  - [Mock 전용] 시나리오 상태 변경 초기화 API 추가 (`POST .../scenario-status/reset` — 변경분을 초기 설정값으로 복원)\n- [Deprecated]\n  - Overview / Scenario / Design API deprecated 처리 (Scenario Group 도메인으로 대체)\n\n</details>\n\n<details>\n<summary><strong>v1.0.0 (2026-05-28)</strong></summary>\n\n- [이벤트 목록]\n  - 조회 파라미터 `suggestedOnly` 추가 (시나리오화 추천 항목만 보기 토글)\n  - `isScenarioSuggested` 필드 추가 (시나리오화 추천 여부)\n  - `scenarioSuggestReason` 필드 추가 (시나리오화 추천 근거. 추천 아님일 때 null)\n  - `indexImpacts[]`에 `impactTerm` / `impactTermLabel` 추가 (영향 시점: 단기 `short` / 중장기 `mid_long`)\n- [이벤트 상세]\n  - `impactAnalysis.indexImpacts[]` 구조 변경: 인덱스별 `shortTerm` / `midLongTerm` (단기·중장기) 슬롯 + `analysisText` (인덱스별 분석 본문)\n  - `driverTreeScoreboard` 구조 변경: 인덱스(JKM/TTF/HH)별 그룹(`indexName` + `drivers[]`)으로 묶고, 각 driver에 `shortTerm` / `midLongTerm` 슬롯 포함\n  - `fundamentalDeepdive` 필드 제거\n  - `relatedEventScenario` 현재 항상 null 반환 (관련 테이블 미준비)\n- [이벤트 관련 레코드]\n  - `summarySourceId` 필드 추가 (요약 원문 식별자 PK)\n\n</details>\n\n<details>\n<summary><strong>v0.5.10 (2026-05-22)</strong></summary>\n\n- [Fundamental Model]\n  - Case 목록/업로드/상세/수정/삭제/실행/상태/초기화 API 데이터 소스 현황 추가\n  - Run 콜백 API 데이터 소스 현황 추가\n\n</details>\n\n<details>\n<summary><strong>v0.5.0 (2026-05-15)</strong></summary>\n\n- [이벤트]\n  - `eventCategoryLv1` → `eventTypeLv1`으로 필드명 통일 (DB 스키마와 일치)\n  - 이벤트 유형 필터: `List<String>` (코드) → `List<Long>` (PK ID) 변경\n  - 요청 파라미터명 `eventTypeLv1` → `eventTypeL1Id`로 변경 (유형 조회 API 응답과 일치)\n  - `parseJsonStringList` 로직 `JsonUtil`로 이관\n  - Repository `Tuple` → `@QueryProjection` 리팩토링\n- [Mock]\n  - 이벤트 유형 L1 ID 기반 필터 동작 지원 (실 DB PK 매핑)\n  - 시나리오 태그(tags) mock 데이터 채움 (726개 전체)\n- [Swagger]\n  - 데이터 소스 현황에 Model Execution API 추가\n- [공통]\n  - `JsonUtil`에 `fromJson(TypeReference)`, `parseJsonStringList` 메서드 추가\n  - 한글 깨짐(`@Comment` 인코딩) 수정\n\n</details>\n\n<details>\n<summary><strong>v0.4.0 (2026-05-11)</strong></summary>\n\n- [Design — 신규 도메인]\n  - Design 이벤트 목록 조회 API 추가 (`GET /design/events`)\n  - 시나리오 생성 요청 API 추가 (`POST /design/generate`)\n  - 시나리오 생성 콜백 수신 API 추가 (`POST /design/callback`)\n  - 생성된 시나리오 조회 API 추가 (`GET /design/generate/{requestId}/scenarios`)\n  - 시나리오 생성 상태 폴링 API 추가 (`GET /design/generate/status`)\n  - Mock 데이터 초기화 API 추가 (`POST /design/reset`)\n- [Design 플로우]\n  - 생성 요청 시 `READY` -> `PROCESSING` 전환, 5초 후 자동 `COMPLETED` 전환\n\n</details>\n\n<details>\n<summary><strong>v0.3.4 (2026-05-08)</strong></summary>\n\n- [Overview]\n  - Overview Event First / Scenario First / Price Forecast API 추가\n- [이벤트]\n  - `signalType`, `signalTypeLabel` 필드 추가\n\n</details>\n\n<details>\n<summary><strong>v0.3.3 (2026-05-08)</strong></summary>\n\n- `impactLevel` → `marketImpactLevel` 필드명 변경\n\n</details>\n\n<details>\n<summary><strong>v0.3.2 (2026-05-07)</strong></summary>\n\n- 시나리오 상세: `Signpost 정의` 섹션 추가, `주요 가정` 간소화\n\n</details>\n\n---\n", "version": "v1.2.62"}, "servers": [{"url": "http://localhost:8080", "description": "Generated server url"}], "security": [{"BearerAuth": []}], "tags": [{"name": "6. MI Fundamental Model Case API", "description": "MI Fundamental Model Scenario Case mock API입니다."}, {"name": "02. Next Gen MI Scenario Group API (Dedicated)", "description": "Next Gen MI Scenario Group 전용 API입니다."}, {"name": "01. Next Gen MI Event API", "description": "Next Gen MI Event API입니다."}, {"name": "02. Next Gen MI Scenario Group API", "description": "Next Gen MI Scenario Group API입니다."}, {"name": "6. MI Fundamental Model Case API", "description": "MI Fundamental Model Scenario Case API입니다."}, {"name": "03-2. Next Gen MI Scenario Design Callback API", "description": "Next Gen MI 시나리오 설계 Agent 콜백 수신 API입니다. (Agent → B.E)"}, {"name": "03-1. Next Gen MI Scenario Design API", "description": "Next Gen MI 시나리오 설계 파이프라인 API입니다."}, {"name": "6-1. MI Fundamental Model Run API", "description": "MI Fundamental Model 실행 Callback API입니다."}, {"name": "04. Next Gen MI Model Execution API", "description": "Next Gen MI MI 수급모델 실행 API입니다."}], "paths": {"/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/design/stream": {"get": {"tags": ["03-1. Next Gen MI Scenario Design API"], "summary": "시나리오 설계 세션 SSE 구독 API", "description": "설계 세션(scenarioGroupId)의 진행 이벤트를 SSE로 구독합니다. <br>\nAgent로부터 `시나리오 생성`, `시나리오 검토`, `Signpost 생성` 콜백이 도착하면 신호(stage)를 푸시하며, **FE는 수신 후 세션 상태 조회 API로 재조회**합니다. <br>\n연결 직후 `connected` 이벤트가 1회 전송됩니다. <br>\n\npush 유실 대비: 재연결 시 재조회 + 폴백 폴링으로 수렴합니다. <br>\n\n<br><br>\n### 전송 형식\n`text/event-stream`. 각 프레임은 이벤트 이름(`event:`)과 JSON 페이로드(`data:`)로 구성됩니다. <br>\n연결 유지를 위해 서버가 약 20초마다 keep-alive 주석 프레임(`:hb`)을 보냅니다. 주석 프레임이므로 `EventSource` 핸들러는 무시하며 FE에서 별도 처리할 필요가 없습니다. <br>\n\n<br><br>\n### 이벤트 종류 & 페이로드\n**(1) `connected`** — 연결 직후 1회. 핸드셰이크 신호이며 이때 FE는 최초 상태를 재조회합니다.\n```\nevent: connected\ndata: {\"scenarioGroupId\":12345}\n```\n\n**(2) `generation`** — 시나리오 생성 콜백 도착 (단계1 시나리오 생성 완료)\n```\nevent: generation\ndata: {\"scenarioGroupId\":12345,\"type\":\"generation\",\"stage\":\"scenario_created\"}\n```\n\n**(3) `validation`** — 시나리오 검토 콜백 도착. **결과에 따라 `stage`가 분기됩니다.**\n- 통과: `stage` = `scenario_validated`\n- 실패: `stage` = `scenario_created`\n```\nevent: validation\ndata: {\"scenarioGroupId\":12345,\"type\":\"validation\",\"stage\":\"scenario_validated\"}\n```\n```\nevent: validation\ndata: {\"scenarioGroupId\":12345,\"type\":\"validation\",\"stage\":\"scenario_created\"}\n```\n\n**(4) `signposts`** — Signpost 콜백 도착 (단계2 signpost 생성 완료)\n```\nevent: signposts\ndata: {\"scenarioGroupId\":12345,\"type\":\"signposts\",\"stage\":\"signpost_created\",\"result\":\"success\"}\n```\n\n**(5) 실패** — Agent 작업 실패 시. **이벤트 이름은 실패한 단계(generation/validation/signposts)와 동일**하되 `result=failure` + `reason`이 실린다. (stage 없음 — DB 미전이)\n```\nevent: generation\ndata: {\"scenarioGroupId\":12345,\"type\":\"generation\",\"result\":\"failure\",\"reason\":\"<에러 메시지>\"}\n```\n\n<br><br>\n### 페이로드 필드\n- `scenarioGroupId`(number): 설계 세션 식별자\n- `type`(string): 트리거 콜백 종류 — `generation` / `validation` / `signposts`\n- `stage`(string): stage 종류 — `scenario_created` / `scenario_validated` / `signpost_created` (실패 시 없음)\n- `result`(string): `success` / `failure`\n- `reason`(string): 실패 사유 (`result=failure`일 때만)\n\n<br><br>\n### 처리 가이드\n- 성공 페이로드는 **신호만** 담습니다. 수신 즉시 `GET /{scenarioGroupId}/design`로 재조회해 화면을 갱신합니다.\n- 연결이 끊기면(타임아웃 30분 등) 재연결 후 `connected` 수신 시 다시 재조회합니다.\n", "operationId": "streamScenarioDesign", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "responses": {"200": {"description": "SSE 연결 성공 (text/event-stream)", "content": {"text/event-stream": {"schema": {"$ref": "#/components/schemas/SseEmitter"}}}}}, "x-order": 0}}, "/api/v1/mi/next-gen/scenario-groups": {"get": {"tags": ["02. Next Gen MI Scenario Group API"], "summary": "Scenario Group 목록 조회 API (그룹, with pagination)", "description": "Scenario Group List 화면의 '그룹' 모드 목록입니다. <br>\n한 행이 시나리오 그룹이며, 펼치면 dimensionColumns(동적 표 헤더) + scenarios(표 본문)로 표 뷰를 구성합니다. <br>\n\n<br><br>\n### 사용 가능한 파라미터\n - sort: 정렬 기준 / 기본값 latest(최신순) / 그룹 생성일시 기준 정렬 / example - sort=latest, sort=oldest\n - startDate / endDate: 조회 기간 (그룹 생성일시 기준)\n - keyword: 시나리오 그룹명 검색 키워드 / example - keyword=카타르\n - page: 기본값 1 / 1-based\n - size: 기본값 20\n\n<br><br>\n### content 항목 필드\n- `scenarioGroupId`: 시나리오 그룹 식별자\n- `groupName`: 시나리오 그룹명\n- `createdAt`: 생성일시 (최신순 정렬·기간 필터 기준)\n- `updatedAt`: 수정일시\n- `summary`: 시나리오 그룹 요약\n- `scenarioCount`: 시나리오 수\n- `dimensionColumns`: 그룹별 동적 표 헤더 (key, label)\n- `scenarios`: 그룹 내 시나리오 표 본문 (scenarioId, scenarioName, baseCase, dimensions, probability, adjustedProbability, status, statusLabel[대기/실현/폐기])\n", "operationId": "getScenarioGroups", "parameters": [{"name": "startDate", "in": "query", "description": "조회 시작일 (yyyy-MM-dd, 그룹 생성일시 기준)", "required": false, "schema": {"type": "string", "format": "date", "description": "조회 시작일", "example": "2026-04-20"}}, {"name": "endDate", "in": "query", "description": "조회 종료일 (yyyy-MM-dd, 그룹 생성일시 기준)", "required": false, "schema": {"type": "string", "format": "date", "description": "조회 종료일", "example": "2026-05-19"}}, {"name": "sort", "in": "query", "description": "정렬 기준 (`latest` / `oldest`, 대소문자 무관). 기본값 `latest`", "required": false}, {"name": "keyword", "in": "query", "description": "시나리오 그룹명 검색 키워드", "required": false, "schema": {"type": "string", "description": "검색 키워드 (그룹 모드: 그룹명 / 개별 모드: 시나리오명)", "example": "카타르"}}, {"name": "page", "in": "query", "description": "페이지 번호 (1-based). 기본값 1", "required": false, "schema": {"type": "integer", "format": "int32", "default": 1, "description": "페이지 번호", "example": 1, "minimum": 1}}, {"name": "size", "in": "query", "description": "페이지당 항목 수. 기본값 20", "required": false, "schema": {"type": "integer", "format": "int32", "default": 20, "description": "페이지당 항목 수", "example": 20, "minimum": 1}}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioGroupListRes"}}}}}, "x-order": 1}, "post": {"tags": ["03-1. Next Gen MI Scenario Design API"], "summary": "시나리오 설계 시작 API (step1 진입)", "description": "`DESIGNABLE` 상태인 이벤트에 대해 시나리오 설계(단계1)를 시작합니다. <br>\n요청 사용자가 해당 이벤트를 점유(lock)하며, Agent에 시나리오 그룹/시나리오 생성을 요청합니다. <br>\n이미 다른 사용자가 설계 중인 이벤트면 점유 충돌로 거부됩니다. <br>\n**비동기**: 설계 시작 시 `stage=ready`로 응답하고, **생성 완료는 generation 콜백(SSE) 수신 후 세션 재조회로 반영**됩니다. <br>\n\n<br><br>\n### 요청 본문\n- `miEventId`: 설계 대상 이벤트 ID\n\n<br><br>\n### 응답 필드 (접수 시점)\n- `scenarioGroupId`\n- `status` + `statusLabel`(creating), `stage` + `stageLabel`(ready) — 생성 완료 후 SSE -> 재조회로 `scenario_created` 전이\n", "operationId": "startScenarioDesign", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioDesignStartReq"}}}, "required": true}, "responses": {"200": {"description": "설계 시작 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioDesignStageRes"}}}}}, "x-order": 1}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/generation/callback": {"post": {"tags": ["03-2. Next Gen MI Scenario Design Callback API"], "summary": "[Agent 콜백] 시나리오 생성 완료 콜백 API", "description": "Agent가 시나리오 그룹/시나리오 생성 및 DB 적재를 완료하면 호출하는 콜백입니다. (Agent → B.E) <br>\n\n<br><br>\n### 요청 본문\n- `result`: Agent 작업 성공 여부 (`success` / `failure`)\n- `reason`: 실패 사유\n- `scenarioGroup`: 그룹 메타 (`status`=creating, `stage`=scenario_created)\n- `table`: 분기항목(headers) + 시나리오(rows)\n", "operationId": "generationCallback", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioGenerationCallbackReq"}}}, "required": true}, "responses": {"200": {"description": "콜백 수신 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseVoid"}}}}}, "x-order": 1}}, "/api/v1/mi/fundamental-model/runs/{runId}/callback": {"post": {"tags": ["6-1. MI Fundamental Model Run API"], "summary": "MI Fundamental Model Scenario Case 실행 완료 Callback API", "description": "모델이 실행 완료 또는 실패 시 호출하여 run/case 상태를 terminal 상태로 갱신합니다.", "operationId": "callback", "parameters": [{"name": "runId", "in": "path", "description": "yyyymmdd_hhmmss_XXXX 형식 실행 추적 ID", "required": true, "schema": {"type": "string", "maxLength": 20, "minLength": 20, "pattern": "^\\d{8}_\\d{6}_[0-9A-F]{4}$"}, "example": "20260521_143500_A1B2"}], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/FundamentalModelRunCallbackReq"}}}, "required": true}, "responses": {"200": {"description": "콜백 처리 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseFundamentalModelRunCallbackRes"}}}}}, "x-order": 1}}, "/api/v1/mi/fundamental-model/cases": {"get": {"tags": ["6. MI Fundamental Model Case API"], "summary": "MI Fundamental Model Scenario Case 목록 조회 API", "description": "MI Fundamental Model case 목록을 조회합니다. keyword가 non-blank인 경우에만 searchType이 필수입니다.", "operationId": "listCases", "parameters": [{"name": "searchType", "in": "query", "description": "검색 대상 필드", "required": false, "schema": {"type": "string", "enum": ["TITLE", "ASSIGNEE_NAME"]}, "example": "TITLE"}, {"name": "keyword", "in": "query", "description": "검색 키워드", "required": false, "schema": {"type": "string"}, "example": "JKM"}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseFundamentalModelCaseListRes"}}}}}, "x-order": 1}, "post": {"tags": ["6. MI Fundamental Model Case API"], "summary": "MI Fundamental Model Scenario Case 업로드 API", "description": "파일 3개와 metadata를 업로드해 PENDING 상태의 Fundamental Model case를 생성합니다.", "operationId": "createCase", "parameters": [{"name": "title", "in": "query", "description": "Scenario Case 제목", "required": true, "schema": {"type": "string"}, "example": "JKM price upside case"}, {"name": "description", "in": "query", "description": "Scenario Case 설명", "required": false, "schema": {"type": "string"}, "example": "May demand shock scenario case"}], "requestBody": {"content": {"multipart/form-data": {"schema": {"type": "object", "properties": {"files": {"type": "array", "description": "모델 실행 입력 파일 3개", "items": {"type": "string", "format": "binary"}}}, "required": ["files"]}}}}, "responses": {"201": {"description": "생성 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseFundamentalModelCaseCreateRes"}}}}}, "x-order": 2}}, "/api/v1/mi/next-gen/scenario-groups/graph/cme-benchmark": {"get": {"tags": ["02. Next Gen MI Scenario Group API (Dedicated)"], "summary": "Scenario Group 그래프 CME 벤치마크 기준선 조회 API (Dedicated)", "description": "그래프 뷰의 CME 벤치마크 기준선 데이터입니다. (전용 DB `midb-skgas` 조회) <br>\n`indexName`(기본 JKM) × `periodUnit`(기본 monthly)으로 **단일 인덱스 × 단일 기간단위**만 반환합니다. <br>\nMI Base/시나리오 시리즈는 기존 그래프 API(`/{scenarioGroupId}/graph`)를 사용하세요. <br>\n\n<br><br>\n### 응답 필드\n- `periodUnit` / `periodUnitLabel`: 기간 단위 (monthly:월별 / yearly:연도별)\n- `dates`: x축 기간 목록 (월별 `yyyy-MM` / 연도별 `yyyy`)\n- `baseSeries`: 기준선 — `CME` 제공 (seriesId / seriesName / values, dates와 동일 순서)\n  - 모든 가격 값은 **소수 2자리 반올림(HALF_UP)**\n  - 연도별은 해당 연 월값의 평균\n- 표출 기간: 월별 = -6M ~ MI BASE 마지막 / 연도별 = -1Y ~ 2030년\n", "operationId": "getScenarioGroupGraphCmeBenchmark", "parameters": [{"name": "indexName", "in": "query", "description": "조회 인덱스 (JKM / TTF / HH). 기본값 JKM", "required": false, "schema": {"type": "string", "default": "JKM", "enum": ["JKM", "TTF", "HH"]}}, {"name": "periodUnit", "in": "query", "description": "기간 단위 (`monthly` / `yearly`, 대소문자 무관). 기본값 `monthly`", "required": false, "schema": {"type": "string", "default": "MONTHLY", "enum": ["monthly", "yearly"]}}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseCmeBenchmarkGraphRes"}}}}}, "x-order": 1}}, "/api/v1/mi/next-gen/events/event-types/lv1": {"get": {"tags": ["01. Next Gen MI Event API"], "summary": "이벤트 유형 L1 목록 조회 API", "description": "이벤트 유형 Level 1 마스터 목록을 조회합니다. <br>\n이벤트 목록 필터의 `eventTypeL1Id` 파라미터에 사용할 ID값을 제공합니다.\n\n<br><br>\n### 응답 필드\n- `eventTypeL1Id`: 이벤트 유형 L1 PK  (필터 파라미터에 사용)\n- `code`: 이벤트 유형 L1 코드\n- `label`: 이벤트 유형 L1 한글명\n", "operationId": "getEventTypesL1", "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseListEventTypeL1Res"}}}}}, "x-order": 1}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/validation/callback": {"post": {"tags": ["03-2. Next Gen MI Scenario Design Callback API"], "summary": "[Agent 콜백] 시나리오 검토 완료 콜백 API", "description": "Agent가 변경사항 검토(자동생성값 채움 + 정합성 검증)를 완료하면 호출하는 콜백입니다. (Agent → B.E) <br>\n**DB 저장 없이** 전체 검토 정보를 전달하므로, B.E는 이를 Redis 키(휘발, TTL)에 임시 저장하고 SSE로 푸시합니다. (FE는 상태 조회로 재조회) <br>\n\n<br><br>\n### 요청 본문\n- `result`: Agent 검토 작업 성공 여부 (`success` / `failure`)\n- `isValid`: 정합성 통과 여부 (`true` → stage `scenario_validated` / `false` → `scenario_created` 유지)\n- `reason`: 실패 사유\n- `scenarioGroup`: 그룹 메타 (`scenarioGroupId`, `status`, `stage`)\n- `table`: 분기항목(headers) + 시나리오(rows)\n", "operationId": "validationCallback", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioValidationCallbackReq"}}}, "required": true}, "responses": {"200": {"description": "콜백 수신 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseVoid"}}}}}, "x-order": 2}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/graph/export": {"get": {"tags": ["02. Next Gen MI Scenario Group API (Dedicated)"], "summary": "Scenario Group 그래프 엑셀 다운로드 API (Dedicated)", "description": "그래프 데이터를 엑셀(.xlsx)로 다운로드 합니다. **전 인덱스(JKM/TTF/HH)를 인덱스별 시트**로 묶어 한 파일로 내려줍니다. <br>\nMI Base/시나리오 시리즈(공통 DB) + **CME 기준선(전용 DB)을 한 파일에 합본**합니다. <br>\n기간 단위는 `periodUnit`(기본 monthly) 하나만 적용되며, 시나리오별로 베이스케이스/사용자조정 2행씩 내려갑니다. <br>\n모든 가격 값은 **소수 2자리 반올림(HALF_UP)** 으로 표기됩니다. <br>\n", "operationId": "exportScenarioGroupGraph", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}, {"name": "periodUnit", "in": "query", "description": "기간 단위 (`monthly` / `yearly`, 대소문자 무관). 기본값 `monthly`", "required": false, "schema": {"type": "string", "default": "MONTHLY", "enum": ["monthly", "yearly"]}}], "responses": {"200": {"description": "다운로드 성공", "content": {"*/*": {"schema": {"type": "string", "format": "binary"}}}}}, "x-order": 2}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/design": {"get": {"tags": ["03-1. Next Gen MI Scenario Design API"], "summary": "시나리오 설계 세션 상태 조회 API", "description": "시나리오 설계(단계1/단계2)의 현재 세션 상태를 조회합니다. <br>\n'전체 초기화'는 reset API로 검토(validation)된 데이터 캐시를 비운 뒤, 해당 API로 DB 생성 초기값을 받습니다. <br>\n\n<br><br>\n### 응답 필드\n- `scenarioGroupId`\n- `status` + `statusLabel` (creating/created/realized)\n- `stage` + `stageLabel` (ready / scenario_created / scenario_validated / signpost_created / completed)\n- `occupied` / `occupantUserId`: 점유 정보\n- `step1`: 분기항목/분기기준 값 시나리오 표\n  - `dimensionColumns[]`(key, label) + `scenarios[]`\n  - 행: `scenarioId`(신규면 null) / `isNew` / `scenarioName` / `baseCase` / `dimensions[]`(key, label, value, valueLabel) / `displayOrder`\n- `step2`: One-view\n  - `groupName` / `summary` / `description` + `table`\n  - 행에 `probability` / `narrative` / `signposts[]`(label, direction+directionLabel, probabilityImpact, strength+strengthLabel, rationale)\n- `validation`: 검토 결과 (`isValid`, `reason`)\n", "operationId": "getScenarioDesign", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioDesignStateRes"}}}}}, "x-order": 2}}, "/api/v1/mi/next-gen/scenario-groups/scenarios": {"get": {"tags": ["02. Next Gen MI Scenario Group API"], "summary": "개별 Scenario 목록 조회 API (개별, with pagination)", "description": "Scenario Group List 화면의 '개별' 모드 목록입니다. <br>\n모든 그룹의 시나리오를 평탄화한 평면 목록으로, 각 행은 부모 그룹 참조(group) + 차원값(dimensions) + 발생 확률(probability)을 가집니다. <br>\n\n<br><br>\n### 사용 가능한 파라미터\n - sort: 정렬 기준 (latest / oldest) / 기본값 latest / 시나리오 생성일시 기준 정렬\n - startDate / endDate: 조회 기간 (시나리오 생성일시 기준)\n - keyword: 시나리오명 검색 키워드\n - page / size: 페이징\n\n<br><br>\n### content 항목 필드\n- `scenarioId`, `scenarioName`, `baseCase`\n- `createdAt`: 시나리오 생성일시 (최신순 정렬·기간 필터 기준)\n- `updatedAt`: 시나리오 수정일시\n- `group`: 부모 그룹 (scenarioGroupId, groupName, createdAt)\n- `dimensions`: 차원값 목록\n- `probability`: 시나리오 발생 확률 (0~100 정수, 원본)\n- `adjustedProbability`: 재분배 확률 — 그룹 내 폐기 제외 비례 재분배(활성 합 100, 폐기=0). 조회 시점 계산값(비영속)\n- `status` / `statusLabel`: 판정 상태 (pending/realized/discarded — 대기/실현/폐기)\n", "operationId": "getScenarioGroupScenarios", "parameters": [{"name": "startDate", "in": "query", "description": "조회 시작일 (yyyy-MM-dd, 시나리오 생성일시 기준)", "required": false, "schema": {"type": "string", "format": "date", "description": "조회 시작일", "example": "2026-04-20"}}, {"name": "endDate", "in": "query", "description": "조회 종료일 (yyyy-MM-dd, 시나리오 생성일시 기준)", "required": false, "schema": {"type": "string", "format": "date", "description": "조회 종료일", "example": "2026-05-19"}}, {"name": "sort", "in": "query", "description": "정렬 기준 (`latest` / `oldest`, 대소문자 무관). 기본값 `latest`", "required": false}, {"name": "keyword", "in": "query", "description": "시나리오명 검색 키워드", "required": false, "schema": {"type": "string", "description": "검색 키워드 (그룹 모드: 그룹명 / 개별 모드: 시나리오명)", "example": "카타르"}}, {"name": "page", "in": "query", "description": "페이지 번호 (1-based). 기본값 1", "required": false, "schema": {"type": "integer", "format": "int32", "default": 1, "description": "페이지 번호", "example": 1, "minimum": 1}}, {"name": "size", "in": "query", "description": "페이지당 항목 수. 기본값 20", "required": false, "schema": {"type": "integer", "format": "int32", "default": 20, "description": "페이지당 항목 수", "example": 20, "minimum": 1}}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioIndividualListRes"}}}}}, "x-order": 2}}, "/api/v1/mi/next-gen/events": {"get": {"tags": ["01. Next Gen MI Event API"], "summary": "Event 목록 조회 API (with pagination)", "description": "Event 목록을 필터, 정렬, 페이징 조건으로 조회합니다. <br>\n\n<br><br>\n### 사용 가능한 파라미터\n - eventStatus: 이벤트 상태 / 기본값 all / example - eventStatus=new, eventStatus=updated\n - sort: 정렬 기준 / 기본값 latest(최신순) / 최신 연관 레코드 최초 생성일시(latestRecordFirstCreated) 기준 정렬 / example - sort=latest, sort=oldest\n - eventTypeL1Id: 이벤트 유형 Lv1 ID 필터 (복수 가능) / example - eventTypeL1Id=1&eventTypeL1Id=2\n - startDate: 커스텀 조회 시작일 / 최신 연관 레코드 최초 생성일시(latestRecordFirstCreated) 기준 / example - startDate=2025-09-01\n - endDate: 커스텀 조회 종료일 / 최신 연관 레코드 최초 생성일시(latestRecordFirstCreated) 기준 / example - endDate=2026-02-28\n - suggestedOnly: 시나리오화 추천 항목만 보기 / 기본값 false / example - suggestedOnly=true\n - keyword: 이벤트 제목 검색 키워드 / example - keyword=호르무즈\n - page: 기본값 1 / 1-based\n - size: 기본값 20\n\n<br><br>\n### 이벤트 상태 (eventStatus)\n- `all`: 전체 이벤트\n- `new`: 신규 이벤트\n- `updated`: 갱신 이벤트\n\n<br><br>\n### events.content 항목 필드\n- `eventId`: 이벤트 고유 식별자\n- `eventName`: 이벤트명\n- `eventTypeLv1` / `eventTypeLv1Label`: 이벤트 유형 Lv1 코드/라벨\n- `createdAt`: 생성일시\n- `updatedAt`: 수정일시\n- `latestRecordFirstCreated`: 최신 연관 레코드 최초 생성일시 (최신순 정렬 기준)\n- `status` / `statusLabel`: 신규(`new`) / 갱신(`updated`)\n- `signalType` / `signalTypeLabel`: 신호(`signal`) / 소음(`noise`)\n- `isScenarioSuggested`: 시나리오화 추천 여부\n- `scenarioSuggestReason`: 시나리오화 추천 근거\n- `scenarioDesignStatus` / `scenarioDesignStatusLabel`: `designable`(설계가능) / `unavailable`(설계불가, 매칭 dimension template 없음) / `creating`(설계중) / `created`(설계완료)\n- `scenarioGroupId`: 활성 시나리오 그룹 ID (없으면 null, `created`일 때 이동 대상)\n- `occupied`: 설계 점유 여부 (설계중이면 true)\n- `occupantUserId`: 점유 사용자 ID (점유 중이 아니면 null)\n- `occupantUserName`: 점유 사용자명 (점유 중이 아니면 null)\n- `indexImpacts`: 인덱스별 영향도 — 단기/중장기 중 영향 강도가 더 큰 시점 1개만 표기 (강도가 같으면 단기).\n  - `indexName` / `marketImpactLevel` / `marketImpactLevelLabel` / `direction` / `directionLabel` / `impactTerm` / `impactTermLabel`\n  - `impactTerm`: `short` 단기 / `mid_long` 중장기\n  - `marketImpactLevel`: `high` / `medium` / `low` (영향없음이면 null)\n  - `direction`: `bullish` 상승 / `bearish` 하락 / `negligible` 보합(영향없음)\n", "operationId": "getEvents", "parameters": [{"name": "eventStatus", "in": "query", "description": "이벤트 상태 (`all` / `new` / `updated`, 대소문자 무관). 기본값 `all`", "required": false}, {"name": "eventTypeL1Id", "in": "query", "description": "이벤트 유형 Lv1 ID. 복수 선택 가능", "required": false, "schema": {"type": "array", "items": {"type": "integer", "format": "int64", "description": "이벤트 유형 Lv1 ID", "example": 1}}}, {"name": "startDate", "in": "query", "description": "조회 시작일 (yyyy-MM-dd, 최신 연관 레코드 최초 생성일시 기준)", "required": false, "schema": {"type": "string", "format": "date", "description": "조회 시작일", "example": "2025-09-01"}}, {"name": "endDate", "in": "query", "description": "조회 종료일 (yyyy-MM-dd, 최신 연관 레코드 최초 생성일시 기준)", "required": false, "schema": {"type": "string", "format": "date", "description": "조회 종료일", "example": "2026-02-28"}}, {"name": "sort", "in": "query", "description": "정렬 기준 (`latest` / `oldest`, 대소문자 무관). 기본값 `latest`", "required": false}, {"name": "keyword", "in": "query", "description": "이벤트 제목 검색 키워드", "required": false, "schema": {"type": "string", "description": "검색 키워드", "example": "호르무즈"}}, {"name": "suggestedOnly", "in": "query", "description": "추천 항목만 보기. 기본값 false", "required": false, "schema": {"type": "boolean", "default": false, "description": "추천 항목만 보기 (시나리오화 추천 = scenario_suggest_yn=Y)", "example": false}}, {"name": "page", "in": "query", "description": "페이지 번호 (1-based). 기본값 1", "required": false, "schema": {"type": "integer", "format": "int32", "default": 1, "description": "페이지 번호", "example": 1, "minimum": 1}}, {"name": "size", "in": "query", "description": "페이지당 항목 수. 기본값 20", "required": false, "schema": {"type": "integer", "format": "int32", "default": 20, "description": "페이지당 항목 수", "example": 20, "minimum": 1}}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseEventListRes"}}}}}, "x-order": 2}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/signposts/callback": {"post": {"tags": ["03-2. Next Gen MI Scenario Design Callback API"], "summary": "[Agent 콜백] Signpost 생성 완료 콜백 API", "description": "Agent가 Signpost 생성 및 DB 적재를 완료하면 호출하는 콜백입니다. (Agent → B.E) <br>\n\n<br><br>\n### 요청 본문\n- `result`: Agent 작업 성공 여부 (`success` / `failure`)\n- `reason`: 실패 사유\n- `scenarioGroup`: 그룹 메타 (`stage`=signpost_created)\n- `table`: 분기항목(headers) + 시나리오(rows) + 시나리오별 `signposts[]` (`metrics`, `narrative` 포함)\n", "operationId": "signpostsCallback", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioSignpostsCallbackReq"}}}, "required": true}, "responses": {"200": {"description": "콜백 수신 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseVoid"}}}}}, "x-order": 3}}, "/api/v1/mi/fundamental-model/cases/{caseId}": {"get": {"tags": ["6. MI Fundamental Model Case API"], "summary": "MI Fundamental Model Scenario Case 상세 조회 API", "description": "case metadata, input/output 다운로드 파일 metadata, latestRun만 조회합니다. full run history와 result payload는 포함하지 않습니다.", "operationId": "getCaseDetail", "parameters": [{"name": "caseId", "in": "path", "description": "Scenario Case ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 101}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseFundamentalModelCaseDetailRes"}}}}}, "x-order": 3}, "delete": {"tags": ["6. MI Fundamental Model Case API"], "summary": "MI Fundamental Model Scenario Case 삭제 API", "description": "case를 physical delete하지 않고 soft delete 처리합니다.", "operationId": "deleteCase", "parameters": [{"name": "caseId", "in": "path", "description": "Scenario Case ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 101}], "responses": {"200": {"description": "삭제 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseVoid"}}}}}, "x-order": 5}, "patch": {"tags": ["6. MI Fundamental Model Case API"], "summary": "MI Fundamental Model Scenario Case 수정 API", "description": "case title/description만 수정하고 최신 상세 응답을 반환합니다.", "operationId": "updateCase", "parameters": [{"name": "caseId", "in": "path", "description": "Scenario Case ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 101}], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/FundamentalModelCaseUpdateReq"}}}, "required": true}, "responses": {"200": {"description": "수정 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseFundamentalModelCaseDetailRes"}}}}}, "x-order": 4}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/graph": {"get": {"tags": ["02. Next Gen MI Scenario Group API"], "summary": "Scenario Group 그래프 데이터 조회 API", "description": "시나리오 그룹 펼침 시 '그래프' 뷰의 데이터입니다. <br>\n`indexName`(기본 JKM) × `periodUnit`(기본 monthly)으로 **단일 인덱스 × 단일 기간단위**만 반환합니다. <br>\n\n<br><br>\n### 응답 필드\n- `periodUnit` / `periodUnitLabel`: 기간 단위 (monthly:월별 / yearly:연도별)\n- `dates`: x축 기간 목록 (월별 `yyyy-MM` / 연도별 `yyyy`)\n- `baseSeries`: 기준선 — `MI Base`(exec_type_cd=MI_BASE 최신 케이스 가격) 제공\n  - `seriesId` / `seriesName` / `values`(dates와 동일 순서, 빠진 구간 null)\n- `scenarioSeries`: 시나리오별 시리즈\n  - `scenarioId` / `scenarioName` / `baseCase`\n  - `status` / `statusLabel`: 판정 상태 (pending/realized/discarded — 폐기여부)\n  - `executed`: 수급모델 실행 완료 여부 (N회차 실행 중 한번이라도 성공되면 true로 응답됩니다.)\n  - `modelRunning`: 수급모델 실행중 여부\n  - `baseCaseValues` / `userAdjustedValues`: 베이스케이스/사용자조정 가격 (최신 완료 결과, 재실행 중에도 직전 결과 유지).\n- 모든 가격 값(baseSeries/scenarioSeries)은 **소수 2자리 반올림(HALF_UP)** 으로 표기됩니다.\n", "operationId": "getScenarioGroupGraph", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}, {"name": "indexName", "in": "query", "description": "조회 인덱스 (JKM / TTF / HH). 기본값 JKM", "required": false, "schema": {"type": "string", "default": "JKM", "enum": ["JKM", "TTF", "HH"]}}, {"name": "periodUnit", "in": "query", "description": "기간 단위 (`monthly` / `yearly`, 대소문자 무관). 기본값 `monthly`", "required": false, "schema": {"type": "string", "default": "MONTHLY", "enum": ["monthly", "yearly"]}}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioGroupGraphRes"}}}}}, "x-order": 3}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/dimension-templates": {"get": {"tags": ["03-1. Next Gen MI Scenario Design API"], "summary": "시나리오 분기항목/분기기준 템플릿 조회 API", "description": "step1에서 분기항목 추가 및 분기기준값 선택 시 사용할 템플릿 목록을 조회합니다. <br>\n선택된 이벤트 유형(event_type_l2)에 정의된 기준입니다. <br>\n\n<br><br>\n### 응답 필드\n- `dimensions[]`: `dimKey`, `label`, `required`, `displayOrder`, `valueEnums[]`(선택 가능한 분기기준값 목록)\n", "operationId": "getScenarioDimensionTemplates", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioDimensionTemplateRes"}}}}}, "x-order": 3}}, "/api/v1/mi/next-gen/events/{eventId}": {"get": {"tags": ["01. Next Gen MI Event API"], "summary": "Event 상세 조회 API", "description": "Event 상세 페이지의 핵심 데이터를 조회합니다. <br>\n\n<br><br>\n### 상위(top-level) 필드\n- `eventId`, `eventName`\n- `status` / `statusLabel`: 신규(`new`) / 갱신(`updated`)\n- `signalType` / `signalTypeLabel`: 신호(`signal`) / 소음(`noise`)\n- `isScenarioSuggested`: 시나리오화 추천 여부\n- `scenarioSuggestReason`: 시나리오화 추천 근거 (추천 아님일 때 null)\n- `scenarioDesignStatus` / `scenarioDesignStatusLabel`: `designable`(설계가능) / `unavailable`(설계불가, 매칭 dimension template 없음) / `creating`(설계중) / `created`(설계완료)\n- `occupied`: 설계 점유 여부 (설계중이면 true)\n- `occupantUserId` / `occupantUserName`: 점유 사용자 ID/명 (점유 중이 아니면 null)\n- `eventTypeLv1` / `eventTypeLv1Label` / `eventTypeLv2` / `eventTypeLv2Label`\n- `createdAt`, `updatedAt`, `latestRecordFirstCreated`(최신 연관 레코드 최초 생성일시)\n\n<br><br>\n### impactAnalysis 필드\n이벤트가 LNG 시장 주요 인덱스(JKM, TTF, Henry Hub)에 미치는 영향을 분석한 결과입니다.\n- `indexImpacts`: 인덱스별 영향도. 각 항목 `indexName`, `shortTerm`, `midLongTerm`\n  - `shortTerm` / `midLongTerm`: `marketImpactLevel` / `marketImpactLevelLabel` / `direction` / `directionLabel`\n  - `midLongTerm`: 중기·장기 영향도 평균(절대값 반올림·부호 유지). 둘 다 없으면 null\n  - `marketImpactLevel`: `high`/`medium`/`low` (영향없음이면 null) · `direction`: `bullish`/`bearish`/`negligible`(보합)\n- `analysisText`: 전체 영향도 종합 요약 (`tmm_mi_impact_m.impact_summary`)\n- `eventTypeLv1` / `eventTypeLv2`: 이벤트 유형 분류 (Lv1: 8종, Lv2: 22종)\n- `sources`: 분석에 사용된 출처(provider) 목록\n\n<br><br>\n### aiInsights 필드\nAI 에이전트가 생성한 이벤트 핵심 요약 및 상세 분석입니다.\n- `keySummaries`: 핵심 요약 포인트 목록\n- `detailedAnalysis`: 상세 분석 본문\n\n<br><br>\n### driverTreeScoreboard 필드\n인덱스(JKM/TTF/HH)별로 driver 묶음을 분리해 표시합니다.\n- 각 항목: `indexName`, `drivers[]`\n- `drivers[]`: `lv1Id/lv1Label`, `lv2Id/lv2Label`, `lv3Id/lv3Label`, `shortTerm`, `midLongTerm`, `reason`\n\n<br><br>\n### relatedEventScenario 필드\n이벤트에서 생성된 시나리오 그룹과 그 시나리오 표입니다. <br>\n**활성 시나리오 그룹이 없으면 null**이며, 이때 화면은 시나리오 설계 버튼을 노출합니다.\n- `scenarioGroupId`, `groupName`\n- `dimensionColumns`: 동적 표 헤더 (key, label) — 시나리오 그룹 목록/상세와 동일 구조\n- `scenarios[]`: `scenarioId`, `scenarioName`, `baseCase`, `dimensions`(차원값, dimensionColumns 순서 매칭),\n  `probability`(원본 0~100),\n  `adjustedProbability`(재분배 확률 — 폐기 제외 비례 재분배로 활성 합 100, 폐기=0, 폐기 없으면 probability와 동일),\n  `status` / `statusLabel`(대기/실현/폐기)\n", "operationId": "getEventDetail", "parameters": [{"name": "eventId", "in": "path", "description": "이벤트 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseEventDetailRes"}}}}}, "x-order": 3}}, "/api/v1/mi/next-gen/scenarios/{scenarioId}/model-executions": {"post": {"tags": ["04. Next Gen MI Model Execution API"], "summary": "MI 수급모델 실행 접수 API", "description": "사용자가 업로드한 입력 파일 3개로 MI 수급모델 실행 비동기 리소스 생성을 요청합니다.", "operationId": "submitModelExecution", "parameters": [{"name": "scenarioId", "in": "path", "description": "시나리오 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "requestBody": {"content": {"multipart/form-data": {"schema": {"type": "object", "properties": {"files": {"type": "array", "description": "모델 실행 입력 파일 3개", "items": {"type": "string", "format": "binary"}}}, "required": ["files"]}}}}, "responses": {"202": {"description": "비동기 실행 접수 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseModelExecutionAcceptRes"}}}}}, "x-order": 4}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/design/validation": {"post": {"tags": ["03-1. Next Gen MI Scenario Design API"], "summary": "시나리오 변경사항 검토 요청 API", "description": "step1에서 사용자가 편집한 분기항목/분기기준/시나리오를 Agent에 검토 요청합니다. <br>\n**검토를 요청해도 Agent는 실제 DB에 반영하지 않습니다.** <br>\n검토 통과 시 stage가 `scenario_validated`로 전이되고, 실패 시 `scenario_created`를 유지하며 사유가 전달됩니다. <br>\n\n<br><br>\n### 요청 본문\n- `table.dimensionColumns[]`: 편집 후 분기항목(헤더) 목록 (key, label)\n- `table.scenarios[]`: 편집 후 최종 시나리오 집합\n  - 미채번 행(`scenarioId` null) = 신규 추가, 요청에서 빠진 행 = 삭제\n  - 행: `scenarioName` / `dimensions[]`(key, value) / `displayOrder` (신규 분기항목 셀은 value null -> Agent 자동생성)\n", "operationId": "validateScenarioDesign", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ScenarioValidationReq"}}}, "required": true}, "responses": {"200": {"description": "검토 요청 접수", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioDesignStageRes"}}}}}, "x-order": 4}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/graph/run-status": {"get": {"tags": ["02. Next Gen MI Scenario Group API"], "summary": "Scenario Group 수급모델 진행상태 폴링 API", "description": "그래프 화면에서 시나리오별 수급모델 진행상태를 경량 조회합니다. <br>\n수급모델 실행 후 해당 API를 폴링하다가 `modelRunning` 필드가 `true` -> `false` 전환 시, 그래프 조회 API(`/{scenarioGroupId}/graph`)를 재조회해 완료된 그래프를 재조회합니다. <br>\n\n<br><br>\n### 응답 필드\n- `anyRunning`: 그룹 내 실행중 시나리오 존재 여부 (그룹 단위 폴링 종료 판단)\n- `scenarios[]`\n  - `scenarioId` : 시나리오 ID\n  - `modelRunning` : 모델 실행중 여부 (재조회 트리거: `true` → `false` 전환)\n", "operationId": "getScenarioGroupGraphRunStatus", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponseScenarioGroupRunStatusRes"}}}}}, "x-order": 4}}, "/api/v1/mi/next-gen/events/{eventId}/outlooks": {"get": {"tags": ["01. Next Gen MI Event API"], "summary": "Event 기관 전망 조회 API (with pagination)", "description": "Event 관련 기관별 시장 전망 정보를 페이징 조회합니다. <br>\n전망 일자(`viewDate`) 내림차순으로 내려갑니다. <br>\n\n<br><br>\n### 사용 가능한 파라미터\n - eventId: 이벤트 ID (Path) / example - 1\n - page: 기본값 1 / 1-based\n - size: 기본값 10\n\n<br><br>\n### content 항목 필드\n- `viewDate`: 전망 일자 (yyyy-MM-dd)\n- `institutionName`: 기관명\n- `outlookSummary`: 전망 요약\n", "operationId": "getEventOutlooks", "parameters": [{"name": "eventId", "in": "path", "description": "이벤트 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}, {"name": "page", "in": "query", "description": "페이지 번호", "required": false, "schema": {"type": "integer", "format": "int32", "default": 1, "minimum": 1}, "example": 1}, {"name": "size", "in": "query", "description": "페이지당 항목 수", "required": false, "schema": {"type": "integer", "format": "int32", "default": 10, "minimum": 1}, "example": 10}], "responses": {"200": {"description": "조회 성공", "content": {"*/*": {"schema": {"$ref": "#/components/schemas/BaseResponsePaginationResEventInstitutionOutlookRes"}}}}}, "x-order": 4}}, "/api/v1/mi/next-gen/scenario-groups/{scenarioGroupId}/design/signposts": {"post": {"tags": ["03-1. Next Gen MI Scenario Design API"], "summary": "Signpost 생성 API (step2 진입)", "description": "step1을 종료하고 step2(One-view 검토)로 진입합니다. <br>\n**편집본 전체 table을 Agent에 전달하며, 이 시점에 시나리오 그룹/시나리오 변경 데이터가 DB에 영속화됩니다** (UPDATE / 신규 INSERT·scenarioId 채번 / 빠진 행 soft delete). <br>\n이어서 Agent가 시나리오별 Signpost / Narrative / 초기확률 / 그룹명·설명을 산출하며, stage가 `signpost_created`로 업데이트 됩니다. <br>\n산출 결과는 Signpost 콜백 후 SSE 푸시 -> 세션 조회로 받아갑니다. <br>\n\n<br><br>\n### 요청 본문\n- `table.dimensionColumns[]` + `table.scenarios[]`: 편집 후 최종 시나리오 표\n  - 행: `scenarioName` / `dimensions[]` / `displayOrder` (검토 후 추가한 신규 시나리오는 `scenarioId` null, 빠진 행 = 삭제)\n  - narrative/확률/baseCase/Signpost는 받지 않음 (Agent 산출)\n", "operationId": "createScenarioSignposts", "parameters": [{"name": "scenarioGroupId", "in": "path", "description": "시나리오 그룹 ID", "required": true, "schema": {"type": "integer", "format": "int64"}, "example": 1}], "requestBody": {"co
