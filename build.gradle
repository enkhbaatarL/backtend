plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '6.6.13.Final'
}

group = 'com.sk'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

hibernate {
    enhancement {
    }
}

//repositories {
//    mavenCentral()
//    maven {
        //url "https://build.shibboleth.net/nexus/content/repositories/releases/"
//        url "https://skpc-nexus.skpc.cloudzcp.net/repository/maven-sre-proxy/"
//    }
//}

springBoot {
    buildInfo()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.session:spring-session-data-redis'

    implementation 'org.springframework.boot:spring-boot-gradle-plugin:3.4.2'

    // saml
    constraints {
        implementation "org.opensaml:opensaml-core:4.3.2"
        implementation "org.opensaml:opensaml-saml-api:4.3.2"
        implementation "org.opensaml:opensaml-saml-impl:4.3.2"
    }
    implementation 'org.springframework.security:spring-security-saml2-service-provider'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-api
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // p6spy
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.2'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.17.0'

    // https://mvnrepository.com/artifact/commons-io/commons-io
    implementation group: 'commons-io', name: 'commons-io', version: '2.18.0'

    // https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.8.5'

    // https://mvnrepository.com/artifact/org.apache.httpcomponents.client5/httpclient5
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.4.4'

    // https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
    implementation group: 'com.mysql', name: 'mysql-connector-j', version: '9.2.0'

    // QueryDSL 의존성
    // https://mvnrepository.com/artifact/io.github.openfeign.querydsl/querydsl-jpa
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:6.11'

    // https://mvnrepository.com/artifact/io.github.openfeign.querydsl/querydsl-apt
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.11:jpa'

    // 이메일
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // excel
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'com.github.pjfanning:poi-shared-strings:2.7.0'
    implementation 'com.github.pjfanning:excel-streaming-reader:5.0.3'

    // csv
    implementation 'org.apache.commons:commons-csv:1.13.0'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // Spring Boot Configuration Processor
    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    // S3
    // https://mvnrepository.com/artifact/com.amazonaws/aws-java-sdk-s3
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.638'

    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'

    // pdf https://mvnrepository.com/artifact/org.apache.pdfbox/pdfbox
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'

    // https://mvnrepository.com/artifact/com.github.jai-imageio/jai-imageio-jpeg2000
    // JPEG 2000(.jp2, .jpx) 형식으로 압축된 이미지를 처리하기 위함
    implementation 'com.github.jai-imageio:jai-imageio-jpeg2000:1.4.0'

    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    implementation "org.commonmark:commonmark:0.24.0"
    implementation "org.commonmark:commonmark-ext-gfm-tables:0.24.0"

    // Playwright (헤드리스 차트 캡처)
    implementation 'com.microsoft.playwright:playwright:1.58.0'

    implementation 'io.fabric8:kubernetes-client:6.13.4'
}

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/sources/annotationProcessor/java/main"
        }
    }
}


tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = "1024m"
}

test {
    // -PforceTest 인자가 있을 경우에만 테스트 활성화
    enabled = project.hasProperty('forceTest')

    // profile 속성이 있을 경우 해당 프로파일을 활성화
    if (project.hasProperty('profile')) {
        systemProperty 'spring.profiles.active', project.property('profile')
    }

    // 시스템 환경 변수를 테스트 JVM에 전달
    environment System.getenv()
}
