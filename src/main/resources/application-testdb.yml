  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: localhost
      port: 6379
      password: no used
      command-timeout: 10s

  security:
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: ${MI_DOMAIN:https://dev-mi.sk.com}/saml/metadata
            acs:
              location: ${MI_DOMAIN:https://dev-mi.sk.com}/login/saml2/sso/mi
              binding: POST
            singlelogout:
              url: ${MI_DOMAIN:https://dev-mi.sk.com}/saml2/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/n.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
            decryption:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: ${MI_DOMAIN:https://dev-mi.sk.com}/callback
      login-error-url: ${MI_DOMAIN:https://dev-mi.sk.com}/error

  web:
    resources:
      add-mappings: false

cache:
  redis:
    time-to-live: 3600s

jwt:
  private-key: ${SKT_MI_JWT_PRIVATE_KEY:}
  public-key: ${SKT_MI_JWT_PUBLIC_KEY:}
  saml2:
    access-token-expiry: 15m
    refresh-token-expiry: 30m
  # 특정 로그인 ID에 한해 위 saml2 기본 만료 시간 대신 적용되는 예외 설정 (위에서부터 먼저 매칭되는 항목 적용)
  # login-ids 는 콤마로 구분된 로그인 ID 목록 (미지정 시 예외 설정 미적용)
  saml2-overrides:
    - login-ids: ${MI_JWT_SAML2_LONG_REFRESH_LOGIN_IDS:test@a.a}
      access-token-expiry: 15m
      refresh-token-expiry: 8h
  oauth2:
    access-token-expiry: 10h
    refresh-token-expiry: 7d

logging:
  config: classpath:logback-local.xml
  level:
    com.sk: DEBUG
    org.springframework.security.saml: INFO
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure.security: INFO
    org.springframework.context: INFO

