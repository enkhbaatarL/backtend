      languages:
        5005: A_ENG


features:
  pdf-viewer:
    dpi: 300
  validation:
    model-agent:
      write-length: -1 # -1 means no limit
      token-usage-limit: 100000000
  scheduling:
    prohibited-word:
      refresh-rate: 3600000 # 1 hour (1h * 1000ms * 60s * 60m)
    event-keyword-alert-scan: # 키워드 알림 스캔
      enabled: true
      fixed-delay-ms: 60000 # 1분
    event-keyword-alert-dispatch: # 키워드 알림 발송
      enabled: true # 켜면 실제 메일 발송
      fixed-delay-ms: 30000 # 30초
      batch-size: 100
      max-attempts: 3
      retry-backoff-minutes: 5
      sending-timeout-minutes: 10

