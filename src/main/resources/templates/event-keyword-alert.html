<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Market Insights - 키워드 알람 발생</title>
  <style>
    table {border-collapse: collapse; border-spacing: 0; margin: 0;}
    div, td {padding: 0;}
    div {margin: 0 !important;}
  </style>
</head>
<body style="font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; background-color: #ffffff; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="background-color: #ffffff;">
  <tr>
    <td align="center" style="padding: 20px 0;">
      <table width="600" cellpadding="0" cellspacing="0" border="0" role="presentation" style="max-width: 600px; margin: 0 auto;">
        <!-- Logo -->
        <tr>
          <td align="center" style="padding: 0;">
            <img src="cid:logo" width="201" height="30" alt="AI Market Insights" style="display: block; margin: 0 auto; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;">
          </td>
        </tr>

        <!-- Head -->
        <tr>
          <td align="center" style="padding: 30px 0 0;">
            <h1 style="font-size: 24px; font-weight: 700; text-align: center; margin: 0 0 20px; color: #212529;">키워드 알람 발생</h1>
            <p style="font-size: 14px; line-height: 1.4; font-weight: 500; text-align: center; color: #495057; margin: 0;">
              등록된 키워드가 포함된 이벤트가 발생하였습니다.
            </p>
          </td>
        </tr>

        <!-- Event Card -->
        <tr>
          <td align="center" style="padding: 30px 95px 0;">
            <table width="410" cellpadding="0" cellspacing="0" border="0" role="presentation" style="width: 410px; background-color: #f8f9fa; border: 1px solid #f1f3f5; border-radius: 6px;">
              <tr>
                <td align="center" style="padding: 20px;">
                  <p th:if="${eventMeta != null}" th:text="${eventMeta}" style="font-size: 16px; line-height: 1.4; font-weight: 700; text-align: center; margin: 0 0 4px; color: #2e3f5e;">신규 · 지정학적 리스크 · 2026-09-28 09:40</p>
                  <p th:text="${eventName}" style="font-size: 16px; line-height: 1.4; font-weight: 500; text-align: center; margin: 0 0 12px; color: #495057; word-break: break-word;">호르무즈 해협 이란 해군 훈련 발표, 유조선·LNG선 우회 검토 확산</p>
                  <p style="font-size: 16px; line-height: 1.4; text-align: center; margin: 0;">
                    <span style="display: inline-block; padding: 4px 8px; border-radius: 4px; background-color: #ffffff;">
                      <span style="font-weight: 600; color: #495057;">키워드</span>&nbsp;&nbsp;<span th:text="${keywordName}" style="font-weight: 700; color: #5191f5;">호르무즈</span>
                    </span>
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Button -->
        <tr>
          <td align="center" style="padding: 30px 0 60px;">
            <table width="260" cellpadding="0" cellspacing="0" border="0" role="presentation" style="width: 260px;">
              <tr>
                <td align="center" style="background-color: #2e3f5e; border-radius: 4px;">
                  <a th:href="${detailLink}" href="#" target="_blank" style="display: block; padding: 10px 16px; font-size: 16px; font-weight: 600; line-height: 1.4; color: #ffffff; text-decoration: none; text-align: center; background-color: #2e3f5e; border-radius: 4px;">이벤트 상세보기</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="border-top: 1px solid #dce1e5; padding: 20px 0 0;">
            <p style="font-size: 10px; color: #9199a1; text-align: center; margin: 0; line-height: 1.5;">
              *본 메일은 발신전용 메일이며 회신처리되지 않습니다. 기타 문의사항은 서비스 관리자에게 문의하세요
            </p>
            <p style="font-size: 10px; color: #9199a1; text-align: center; margin: 0; line-height: 1.5;">
              ⓒ 2025 SKT Co.,ltd. All right reserved.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
