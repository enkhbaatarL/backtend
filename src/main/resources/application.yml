spring:
  profiles:
    active: local
  application:
    name: mi
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: spring:session

  jpa:
    hibernate:
      ddl-auto: validate # 변경 금지
    properties:
      hibernate:
        query.in_clause_parameter_padding: true
        default_batch_fetch_size: 50
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        format_sql: false
        show_sql: false
        use_sql_comments: false
        jmx.enabled: true
    open-in-view: false # 변경 금지

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      min-spare: 10
      max: 400
    remoteIp:
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for
  port: 8080
#  address: 127.0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    persist-authorization: true
    doc-expansion: none

security:
  enabled: true

mcp:
  auth:
    # [MCP 인증] mcp.read-only-api(개발용 인증 우회) 삭제. MCP Basic Auth 시크릿 PBKDF2 반복 횟수 (신규 발급·재발급에 적용, 기존 키는 키별로 저장된 값 사용). 최소 1000
    hash-iterations: ${MCP_AUTH_HASH_ITERATIONS:1000}
  # [MCP 인증] X-User-Id 헤더가 없을 때 대신 위임할 사용자 로그인 ID. 비워 두면 X-User-Id 필수(누락 시 403)
  default-id: ${MCP_DEFAULT_ID:}
  # [MCP Event Generate] 이벤트 생성 비동기 작업 (dedicated profile 에서만 쓴다. 다른 profile 에서는 읽지 않는다)
  # 환경변수로 바꿀 때는 relaxed binding 이름을 쓴다 (예: MCP_EVENT_GENERATION_MAX_CONCURRENT)
  event-generation:
    # 서버당 동시에 실행할 수 있는 생성 작업 수 (실행 스레드·생성 서버 연결 수도 이 값). 넘는 요청은 BIZ-001 로 즉시 거절
    max-concurrent: 10
    # 실행 중 작업 heartbeat 주기(ms)와, heartbeat 가 이 시간 이상 끊긴 작업을 INTERRUPTED 로 정리하는 기준
    heartbeat-rate-ms: 60000
    stale-after: 5m

mi:
  model-input:
    restore:
      enabled: true
    restore-preview:
      enabled: true
      max-concurrent: ${MODEL_INPUT_RESTORE_READ_MAX_CONCURRENT:1}
      timeout-ms: ${MODEL_INPUT_RESTORE_READ_TIMEOUT_MS:30000}
      scratch-bytes: ${MODEL_INPUT_RESTORE_READ_SCRATCH_BYTES:268435456}
  autocomplete:
    initial-load:
      enabled: false
