spring:
  profiles:
    active: local
  application:
    name: mi
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: spring:session

  jpa:
    hibernate:
      ddl-auto: validate # 변경 금지
    properties:
      hibernate:
        query.in_clause_parameter_padding: true
        default_batch_fetch_size: 50
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        format_sql: false
        show_sql: false
        use_sql_comments: false
        jmx.enabled: true
    open-in-view: false # 변경 금지

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      min-spare: 10
      max: 400
    remoteIp:
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for
  port: 8080
#  address: 127.0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    persist-authorization: true
    doc-expansion: none

security:
  enabled: true

mcp:
  auth:
    # [MCP 인증] mcp.read-only-api(개발용 인증 우회) 삭제. MCP Basic Auth 시크릿 PBKDF2 반복 횟수 (신규 발급·재발급에 적용, 기존 키는 키별로 저장된 값 사용). 최소 1000
    hash-iterations: ${MCP_AUTH_HASH_ITERATIONS:1000}

mi:
  autocomplete:
    initial-load:
      enabled: false
