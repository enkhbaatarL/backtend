spring:
  profiles:
    active: local
  application:
    name: mi
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

#  session:
#    timeout: 30m
#    redis:
#      flush-mode: on-save        # 세션 저장 타이밍 설정 (on-save 또는 immediate)
#      namespace: spring:session  # Redis key prefix (파드 간 세션 충돌 방지에 유리)

  jpa:
    hibernate:
      ddl-auto: validate # 변경 금지
    properties:
      hibernate:
        query.in_clause_parameter_padding: true
        default_batch_fetch_size: 50
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        format_sql: false
        show_sql: false
        use_sql_comments: false
        jmx.enabled: true
    open-in-view: false # 변경 금지

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      min-spare: 10
      max: 400
    remoteIp:
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for
  port: 8080
  address: 127.0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    persist-authorization: true
    doc-expansion: none
