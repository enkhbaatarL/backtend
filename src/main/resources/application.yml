spring:
  profiles:
    active: local
  application:
    name: mi
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: spring:session

  jpa:
    hibernate:
      ddl-auto: validate # 변경 금지
    properties:
      hibernate:
        query.in_clause_parameter_padding: true
        default_batch_fetch_size: 50
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        format_sql: false
        show_sql: false
        use_sql_comments: false
        jmx.enabled: true
    open-in-view: false # 변경 금지

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      min-spare: 10
      max: 400
    remoteIp:
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for
  port: 8080
#  address: 127.0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    persist-authorization: true
    doc-expansion: none

security:
  enabled: true

mi:
  next-gen:
    mock:
      events:
        api:
          get-list: false
          get-detail: false
          get-records: false
          get-outlooks: false
          design-availability: false
      scenario-groups:
        api:
          get-list: false
          get-scenarios: false
          get-graph: false
          get-detail: false
          get-scenario-detail: false
          update-scenario-status: false
          delete-group: false
      model-executions:
        api:
          get-parameters: true
          submit: true
          get-status: true
          callback: true
        workflow:
          dispatch-success: true
          running-timeout-minutes: 10
          auto-complete-seconds: 5
      design:
        callback-delay-seconds: 15
        api:
          start: false
          get-state: false
          get-dimension-templates: false
          validate: false
          create-signposts: false
          confirm: false
          reset: false
