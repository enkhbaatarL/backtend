spring:
  config:
    activate:
      on-profile: prod
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    master:
      company-cd: master
      jdbc-url: ${SKT_MI_DB_URL_MASTER}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${SKT_MI_DB_USERNAME_MASTER}
      password: ${SKT_MI_DB_PASSWORD_MASTER}
      hikari:
        connection-timeout: 7s
        maximum-pool-size: 10
        idle-timeout: 10m
        max-lifetime: 15m
        connection-test-query: SELECT 1
        validation-timeout: 3000
        minimum-idle: 5
    tenants:
      - company-cd: midb
        jdbc-url: ${SKT_MI_DB_URL_MASTER}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER}
        password: ${SKT_MI_DB_PASSWORD_MASTER}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 10
          idle-timeout: 10m
          max-lifetime: 15m
          connection-test-query: SELECT 1
          validation-timeout: 3000
          minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  security:
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: https://mi.sk.com/saml/metadata
            acs:
              location: https://mi.sk.com/login/saml2/sso/mi
              binding: POST
            singlelogout:
              url: https://mi.sk.com/saml2/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/n.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
            decryption:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: https://mi.sk.com/callback
      login-error-url: https://mi.sk.com/error


  web:
    resources:
      add-mappings: false

redis:
  service-name: mymaster
  redis-password: ${SKT_MI_REDIS_PASSWORD}
  sentinel-password: ${SKT_MI_REDIS_SENTINEL_PASSWORD}
  sentinel-host-node: redis.mi-redis
  sentinel-port: 26379

cache:
  redis:
    time-to-live: 3600s

jwt:
  private-key: ${SKT_MI_JWT_PRIVATE_KEY}
  public-key: ${SKT_MI_JWT_PUBLIC_KEY}
  saml2:
    access-token-expiry: 15m
    refresh-token-expiry: 30m
  oauth2:
    access-token-expiry: 10h
    refresh-token-expiry: 7d

logging:
  config: classpath:logback-prod.xml
  level:
    com.sk: INFO
    org.springframework.security.saml: INFO
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure.security: INFO
    org.springframework.context: INFO

api:
  model-agent:
    url: https://adxp.adotbiz.ai/api/v1/agent_gateway
    connection-timeout: 1s
    read-timeout: 120s
    api-key: ${SKT_MI_MODEL_AGENT_API_KEY:sk-688a6f372985fa406fd70ca29731c0d4}
    app-id: ${SKT_MI_MODEL_AGENT_APP_ID:5fde7dbd-a380-41f3-978a-05798509a4f5}
  auth-token:
    url: https://mi.sk.com
    connection-timeout: 1s
    read-timeout: 20s
  ax-platform:
    url: https://adxp.adotbiz.ai
    connection-timeout: 1s
    read-timeout: 20s
    datasource-id: e0e0e60d-8251-4425-b588-4f0a5131f9ae

mail:
  except-company-no: 2013
  smtp:
    host: smtp.worksmobile.com
    port: 465
    username: ${SKT_MI_NO_REPLY_MAIL_ADDR:no-reply@ai-market-insights.co.kr}
    password: ${SKT_MI_NO_REPLY_MAIL_PW:Godqhr0630}
    from: ${SKT_MI_NO_REPLY_MAIL_ADDR:no-reply@ai-market-insights.co.kr}
    properties:
      transport-protocol: smtp
      auth: true
      ssl-enable: true
      starttls-enable: false
      ssl-protocols: TLSv1.2
      connectiontimeout: 10000
      debug: true

mybatis:
  type-aliases-package: com.sk.domain.shared.entity
  config-location: classpath:mybatis/mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true

ncp:
  storage:
    end-point: https://zskc.object.ncpstorage.com
    region-name: PCS03
    access-key: ${SKT_MI_NCP_STORAGE_ACCESS_KEY}
    secret-key: ${SKT_MI_NCP_STORAGE_SECRET_KEY}
    bucket-name: sk-mi-p-osb-03
    prefix: sk-mi-p-osb-ss-

aes:
  secret-key: ${SKT_MI_AES_SECRET_KEY}

server:
  domain: https://mi.sk.com
  insight:
    latest:
      except-provider-no: 5000
  provider:
    default:
      languages:
        5005: A_ENG

features:
  pdf-viewer:
    dpi: 300
  validation:
    model-agent:
      write-length: -1 # -1 means no limit
      token-usage-limit: 100000000
  scheduling:
    prohibited-word:
      refresh-rate: 3600000 # 1 hour (1h * 1000ms * 60s * 60m)

decorator:
  datasource:
    p6spy:
      enable-logging: false # 변경 금지

custom:
  gie-eu:
    goods-data-source-no: 4209
    card-index: 6
