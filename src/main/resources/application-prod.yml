mail:
  except-company-no: 2013
  smtp:
    host: email-smtp.ap-northeast-2.amazonaws.com
    port: 465
    username: ${SKT_MI_NO_REPLY_MAIL_USERNAME:AKIASF4YAEJSVKP3P3O3}
    password: ${SKT_MI_NO_REPLY_MAIL_PW:BMsw5q2ZzLMToeeyFFFg6RW/R6Unf0hrGRzOwWVnNc1G}
    from: ${SKT_MI_NO_REPLY_MAIL_ADDR:no-reply@marketforesight.ai}
    properties:
      transport-protocol: smtp
      auth: true
      ssl-enable: true
      starttls-enable: false
