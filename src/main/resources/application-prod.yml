spring:
  config:
    activate:
      on-profile: prod
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    master:
      company-cd: master
      jdbc-url: ${SKT_MI_DB_URL_MASTER}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${SKT_MI_DB_USERNAME_MASTER}
      password: ${SKT_MI_DB_PASSWORD_MASTER}
      hikari:
        connection-timeout: 7s
        maximum-pool-size: 100
        idle-timeout: 10m
        max-lifetime: 15m
        connection-test-query: SELECT 1
        validation-timeout: 3000
        minimum-idle: 20
    tenants:
      - company-cd: midb
        jdbc-url: ${SKT_MI_DB_URL_MASTER}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER}
        password: ${SKT_MI_DB_PASSWORD_MASTER}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 100
          idle-timeout: 10m
          max-lifetime: 15m
          connection-test-query: SELECT 1
          validation-timeout: 3000
          minimum-idle: 20

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  security:
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: ${MI_DOMAIN:https://mi.sk.com}/saml/metadata
            acs:
              location: ${MI_DOMAIN:https://mi.sk.com}/login/saml2/sso/mi
              binding: POST
            singlelogout:
              url: ${MI_DOMAIN:https://mi.sk.com}/saml2/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/n.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
            decryption:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: ${MI_DOMAIN:https://mi.sk.com}/callback
      login-error-url: ${MI_DOMAIN:https://mi.sk.com}/error


  web:
    resources:
      add-mappings: false

redis:
  service-name: mymaster
  redis-password: ${SKT_MI_REDIS_PASSWORD}
  sentinel-password: ${SKT_MI_REDIS_SENTINEL_PASSWORD}
  sentinel-host-node: redis.mi-redis
  sentinel-port: 26379

cache:
  redis:
    time-to-live: 3600s

jwt:
  private-key: ${SKT_MI_JWT_PRIVATE_KEY}
  public-key: ${SKT_MI_JWT_PUBLIC_KEY}
  saml2:
    access-token-expiry: 15m
    refresh-token-expiry: 30m
  # 특정 로그인 ID에 한해 위 saml2 기본 만료 시간 대신 적용되는 예외 설정 (위에서부터 먼저 매칭되는 항목 적용)
  # login-ids 는 콤마로 구분된 로그인 ID 목록 (미지정 시 예외 설정 미적용)
  saml2-overrides:
    - login-ids: ${MI_JWT_SAML2_LONG_REFRESH_LOGIN_IDS:}
      access-token-expiry: 15m
      refresh-token-expiry: 8h
  oauth2:
    access-token-expiry: 10h
    refresh-token-expiry: 7d

logging:
  config: classpath:logback-prod.xml
  level:
    com.sk: INFO
    org.springframework.security.saml: INFO
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure.security: INFO
    org.springframework.context: INFO

api:
  model-agent:
    url: https://adxp.adotbiz.ai/api/v1/agent_gateway
    connection-timeout: 1s
    read-timeout: 120s
    api-key: ${SKT_MI_MODEL_AGENT_API_KEY:sk-688a6f372985fa406fd70ca29731c0d4}
    app-id: ${SKT_MI_MODEL_AGENT_APP_ID:5fde7dbd-a380-41f3-978a-05798509a4f5}
  auth-token:
