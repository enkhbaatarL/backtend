mybatis:
  type-aliases-package: com.sk.domain.shared.entity
  config-location: classpath:mybatis/mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true

ncp:
  storage:
    end-point: https://zskc.object.ncpstorage.com
    region-name: PCS03
    access-key: ${SKT_MI_NCP_STORAGE_ACCESS_KEY}
    secret-key: ${SKT_MI_NCP_STORAGE_SECRET_KEY}
    bucket-name: sk-mi-p-osb-03
    prefix: sk-mi-p-osb-ss-

aes:
  secret-key: ${SKT_MI_AES_SECRET_KEY}

server:
  domain: ${MI_DOMAIN:https://mi.sk.com}
  insight:
    latest:
      except-provider-no: 5000
  provider:
    default:
      languages:
        5005: A_ENG

features:
  pdf-viewer:
    dpi: 300
  validation:
    model-agent:
      write-length: -1 # -1 means no limit
      token-usage-limit: 100000000
  scheduling:
    prohibited-word:
      refresh-rate: 3600000 # 1 hour (1h * 1000ms * 60s * 60m)
    event-keyword-alert-scan: # 키워드 알림 스캔
      enabled: true
      fixed-delay-ms: 60000 # 1분
    event-keyword-alert-dispatch: # 키워드 알림 발송
      enabled: true # 켜면 실제 메일 발송
      fixed-delay-ms: 30000 # 30초
      batch-size: 100
      max-attempts: 3
      retry-backoff-minutes: 5
      sending-timeout-minutes: 10

decorator:
  datasource:
    p6spy:
      enable-logging: false # 변경 금지

custom:
  gie-eu:
    goods-data-source-no: 4209
    card-index: 6

chart-capture:
  frontend-base-url: ${MI_DOMAIN:https://mi.sk.com}
  jwt-ttl-seconds: 300
  capture-timeout-ms: 30000

kubernetes:
  namespace: ${MI_K8S_NAMESPACE:}
  image: ${MI_K8S_IMAGE:}
  callback-base-url: ${MI_K8S_CALLBACK_BASE_URL:}
  command: ${MI_K8S_COMMAND:}  # smoke용: "python3,-c" / 실제 모델 이미지 사용 시 비워둠
  env-config-map-name: ${MI_K8S_ENV_CONFIG_MAP_NAME:}
  env-secret-name: ${MI_K8S_ENV_SECRET_NAME:}
  image-pull-secret-name: ${MI_K8S_IMAGE_PULL_SECRET_NAME:}
  ttl-seconds-after-finished: ${MI_K8S_TTL_SECONDS_AFTER_FINISHED:3600}
