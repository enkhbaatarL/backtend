spring:
  config:
    activate:
      on-profile: dev
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    master:
      company-cd: master
      jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${SKT_MI_DB_USERNAME_MASTER}
      password: ${SKT_MI_DB_PASSWORD_MASTER}
      hikari:
        connection-timeout: 7s
        maximum-pool-size: 10
        idle-timeout: 10m
        max-lifetime: 15m
        connection-test-query: SELECT 1
        validation-timeout: 3000
        minimum-idle: 5
    tenants:
      - company-cd: midb
        jdbc-url: ${SKT_MI_DB_URL_MASTER}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER}
        password: ${SKT_MI_DB_PASSWORD_MASTER}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 10
          idle-timeout: 10m
          max-lifetime: 15m
          connection-test-query: SELECT 1
          validation-timeout: 3000
          minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${jwt.secret-key}
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: https://dev-mi.sk.com/saml/metadata
            acs:
              location: https://dev-mi.sk.com/login/saml2/sso/mi
              binding: POST
            singlelogout:
              url: https://dev-mi.sk.com/saml2/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/devn.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
            decryption:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: https://dev-mi.sk.com/callback
      login-error-url: https://dev-mi.sk.com/error


  web:
    resources:
      add-mappings: false

redis:
  service-name: mymaster
  redis-password: ${SKT_MI_REDIS_PASSWORD}
  sentinel-password: ${SKT_MI_REDIS_SENTINEL_PASSWORD}
  sentinel-host-node: redis.mi-redis
  sentinel-port: 26379

cache:
  redis:
    time-to-live: 3600s

jwt:
  secret-key: ${SKT_MI_JWT_SECRET_KEY}
  saml2:
    access-token-expiry: 3m
    refresh-token-expiry: 30m
  oauth2:
    access-token-expiry: 10h
    refresh-token-expiry: 7d

logging:
  config: classpath:logback-dev.xml
  level:
    org.springframework.security.saml: TRACE
    org.springframework.security: TRACE
    org.springframework.boot.autoconfigure.security: TRACE
    org.springframework.context: DEBUG
    org.springframework.session: DEBUG

api:
  model-agent:
    url: https://devadxp.adotbiz.ai/api/v1/agent_gateway
    connection-timeout: 1s
    read-timeout: 120s
    api-key: ${SKT_MI_MODEL_AGENT_API_KEY:sk-a001c3a2cb5dbb234bc1fa1d113f2d53}
    app-id: ${SKT_MI_MODEL_AGENT_APP_ID:e3064bc4-1871-4072-8f79-ed5271c50f81}
  auth-token:
    url: https://dev-mi.sk.com
    connection-timeout: 1s
    read-timeout: 20s
  ax-platform:
    url: https://devadxp.adotbiz.ai
    connection-timeout: 1s
    read-timeout: 20s
    datasource-id: b6578dac-c777-403a-885c-c76c39d091c4

mail:
  smtp:
    host: smtp.worksmobile.com
    port: 465
    username: ${SKT_MI_NO_REPLY_MAIL_ADDR}
    password: ${SKT_MI_NO_REPLY_MAIL_PW}
    from: ${SKT_MI_NO_REPLY_MAIL_ADDR}
    properties:
      transport-protocol: smtp
      auth: true
      ssl-enable: true
      starttls-enable: false
      ssl-protocols: TLSv1.2
      connectiontimeout: 10000
      debug: true

mybatis:
  type-aliases-package: com.sk.domain.shared.entity
  config-location: classpath:mybatis/mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true

ncp:
  storage:
    end-point: https://zskc.object.ncpstorage.com
    region-name: PCS03
    access-key: ${SKT_MI_NCP_STORAGE_ACCESS_KEY}
    secret-key: ${SKT_MI_NCP_STORAGE_SECRET_KEY}
    bucket-name: sk-mi-d-osb-03
    prefix: sk-mi-d-osb-ss-

aes:
  secret-key: ${SKT_MI_AES_SECRET_KEY}

server:
  domain: https://dev-mi.sk.com
  insight:
    latest:
      except-provider-no: 5000
    focused:
      threshold-day: 50
  provider:
    default:
      languages:
        5005: A_ENG

features:
  pdf-viewer:
    dpi: 300
  validation:
    model-agent:
      write-length: -1 # -1 means no limit
      token-usage-limit: 100000000
  scheduling:
    prohibited-word:
      refresh-rate: 3600000 # 1 hour (1h * 1000ms * 60s * 60m)
