  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${jwt.secret-key}
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: https://dev-mi.sk.com/saml/metadata
            acs:
              location: https://dev-mi.sk.com/saml2/sso/mi
              binding: POST
            singlelogout:
              url: https://dev-mi.sk.com/saml/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/devn.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: https://dev-mi.sk.com/callback
      login-error-url: https://dev-mi.sk.com/error

  web:
    resources:
      add-mappings: false

redis:
  service-name: mymaster
  redis-password: ${SKT_MI_REDIS_PASSWORD:wM2iWi7LmU}
  sentinel-password: ${SKT_MI_REDIS_SENTINEL_PASSWORD:wM2iWi7LmU}
  sentinel-host-node: redis.mi-redis
  sentinel-port: 26379

cache:
