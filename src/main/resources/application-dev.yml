spring:
  config:
    activate:
      on-profile: dev
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    master:
      company-cd: master
      jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${SKT_MI_DB_USERNAME_MASTER}
      password: ${SKT_MI_DB_PASSWORD_MASTER}
      hikari:
        connection-timeout: 7s
        maximum-pool-size: 50
        idle-timeout: 10m
        max-lifetime: 15m
        connection-test-query: SELECT 1
        validation-timeout: 3000
        minimum-idle: 10
    tenants:
      - company-cd: midb
        jdbc-url: ${SKT_MI_DB_URL_MASTER}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER}
        password: ${SKT_MI_DB_PASSWORD_MASTER}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 50
          idle-timeout: 10m
          max-lifetime: 15m
          connection-test-query: SELECT 1
          validation-timeout: 3000
          minimum-idle: 10

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  security:
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: ${MI_DOMAIN:https://dev-mi.sk.com}/saml/metadata
            acs:
              location: ${MI_DOMAIN:https://dev-mi.sk.com}/login/saml2/sso/mi
              binding: POST
            singlelogout:
              url: ${MI_DOMAIN:https://dev-mi.sk.com}/saml2/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/devn.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
            decryption:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: ${MI_DOMAIN:https://dev-mi.sk.com}/callback
      login-error-url: ${MI_DOMAIN:https://dev-mi.sk.com}/error


  web:
    resources:
      add-mappings: false

redis:
  service-name: mymaster
  redis-password: ${SKT_MI_REDIS_PASSWORD}
  sentinel-password: ${SKT_MI_REDIS_SENTINEL_PASSWORD}
  sentinel-host-node: redis.mi-redis
  sentinel-port: 26379

cache:
  redis:
    time-to-live: 3600s

jwt:
  private-key: ${SKT_MI_JWT_PRIVATE_KEY}
  public-key: ${SKT_MI_JWT_PUBLIC_KEY}
  saml2:
    access-token-expiry: 3m
    refresh-token-expiry: 30m
  oauth2:
    access-token-expiry: 10h
    refresh-token-expiry: 7d

logging:
  config: classpath:logback-dev.xml
  level:
    com.sk: DEBUG
    org.springframework.security.saml: INFO
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure.security: INFO
    org.springframework.context: INFO
    org.springframework.session: INFO

