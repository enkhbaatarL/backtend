spring:
  config:
    activate:
      on-profile: dedicated
  datasource:
    tenants:
      - company-cd: midb
        jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc:mysql://db-32qpgf.vpc-cdb-pcs03.ntruss.com:3306/midb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER:pcc07377}
        password: ${SKT_MI_DB_PASSWORD_MASTER:mippcc07377!@}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 20
          idle-timeout: 10m
          max-lifetime: 15m
          minimum-idle: 10
      - company-cd: ${SKT_MI_DB_DEDICATED_NAME:midb-skens}
        jdbc-url: ${SKT_MI_DB_DEDICATED_URL:jdbc:mysql://db-32qpgf.vpc-cdb-pcs03.ntruss.com:3306/mi-skens?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER}
        password: ${SKT_MI_DB_PASSWORD_MASTER}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 20
          idle-timeout: 10m
          max-lifetime: 15m
          connection-test-query: SELECT 1
          validation-timeout: 3000
          minimum-idle: 10

dedicated:
  company-no: 2013

file:
  encryption:
    enabled: true
    enabled-company-cds: SKGAS
    target-extensions: xlsx,xls,xlsm,docx,doc,docm,pptx,ppt,pptm

external:
  file-crypto:
    base-url: ${FILE_CRYPTO_BASE_URL:}
    upload-path: ${FILE_CRYPTO_UPLOAD_PATH:}
    status-path: ${FILE_CRYPTO_STATUS_PATH:}
    encrypt-path: ${FILE_CRYPTO_ENCRYPT_PATH:}
    decrypt-path: ${FILE_CRYPTO_DECRYPT_PATH:}
    connection-timeout: ${FILE_CRYPTO_CONNECTION_TIMEOUT:3s}
    read-timeout: ${FILE_CRYPTO_READ_TIMEOUT:30s}
    retry-count: ${FILE_CRYPTO_RETRY_COUNT:1}
    retry-backoff-ms: ${FILE_CRYPTO_RETRY_BACKOFF_MS:500}
    pid: ${FILE_CRYPTO_PID:}
    label-id: ${FILE_CRYPTO_LABEL_ID:}
    user-id: ${FILE_CRYPTO_USER_ID:}

kubernetes:
  namespace: ${MI_K8S_NAMESPACE:}
  image: ${MI_K8S_IMAGE:}
  callback-base-url: ${MI_K8S_CALLBACK_BASE_URL:}
  command: ${MI_K8S_COMMAND:}  # smoke용: "python3,-c" / 실제 모델 이미지 사용 시 비워둠
  env-config-map-name: ${MI_K8S_ENV_CONFIG_MAP_NAME:}
  env-secret-name: ${MI_K8S_ENV_SECRET_NAME:}
  image-pull-secret-name: ${MI_K8S_IMAGE_PULL_SECRET_NAME:}
  ttl-seconds-after-finished: ${MI_K8S_TTL_SECONDS_AFTER_FINISHED:3600}
