spring:
  config:
    activate:
      on-profile: local
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    master:
      company-cd: master
      jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc:mysql://localhost:3306/midb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&autoReconnect=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${SKT_MI_DB_USERNAME_MASTER:min}
      password: ${SKT_MI_DB_PASSWORD_MASTER:min}
      hikari:
        connection-timeout: 7s
        maximum-pool-size: 10
        idle-timeout: 10m
        max-lifetime: 15m
        connection-test-query: SELECT 1
        validation-timeout: 3000
        minimum-idle: 5
    tenants:
      - company-cd: midb
        jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc:mysql://localhost:3306/midb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&autoReconnect=true}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER:min}
        password: ${SKT_MI_DB_PASSWORD_MASTER:min}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 10
          idle-timeout: 10m
          max-lifetime: 15m
          connection-test-query: SELECT 1
          validation-timeout: 3000
          minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: localhost
      port: 6379
      password: no used
      command-timeout: 10s

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${jwt.secret-key}
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: https://dev-mi.sk.com/saml/metadata
            acs:
              location: https://dev-mi.sk.com/login/saml2/sso/mi
              binding: POST
            singlelogout:
              url: https://dev-mi.sk.com/saml2/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/n.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
            decryption:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: https://dev-mi.sk.com/callback
      login-error-url: https://dev-mi.sk.com/error

  web:
    resources:
      add-mappings: false

cache:
  redis:
    time-to-live: 3600s

jwt:
  secret-key: ${SKT_MI_JWT_SECRET_KEY:5a13e7a8276275ac76d7656dce0a4430f26d3c89d08174d7cd67968c0eb1beb5}
  saml2:
    access-token-expiry: 15m
    refresh-token-expiry: 30m
  oauth2:
    access-token-expiry: 10h
    refresh-token-expiry: 7d

logging:
  config: classpath:logback-local.xml
  level:
    com.sk: DEBUG
    org.springframework.security.saml: INFO
    org.springframework.security: INFO
    org.springframework.boot.autoconfigure.security: INFO
    org.springframework.context: INFO

decorator:
