spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:backend
    driver-class-name: org.h2.Driver
    username: root
    password: "1234"
    hikari:
      maximum-pool-size: 5
      maxLifeTime: 60000
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${jwt.secret-key}

jwt:
  secret-key: c2VjcmV0LWtleS1mb3ItbWktcGxhdGZvcm0tc3ByaW5nLWJvb3QtYXBwbGljYXRpb24tc2VjdXJpdHktand0LXRva2VuLWF1dGhlbnRpY2F0aW9u
  access-token-expiry: 36000000  # 10 hours (10h * 1000ms * 60s * 60m)
  refresh-token-expiry: 604800000  # 7 days (7d * 24h * 1000ms * 60s * 60m)


logging:
  config: classpath:logback-local.xml

api:
  sample:
    url: http://localhost:8081
    connection-timeout: 1s
    read-timeout: 20s


decorator:
  datasource:
    p6spy:
      enable-logging: false
