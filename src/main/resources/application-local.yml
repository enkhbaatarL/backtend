spring:
  config:
    activate:
      on-profile: local
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    master:
      company-cd: master
      jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc:mysql://1.tcp.jp.ngrok.io:20789/midb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${SKT_MI_DB_USERNAME_MASTER:min}
      password: ${SKT_MI_DB_PASSWORD_MASTER:min}
      hikari:
        connection-timeout: 7s
        maximum-pool-size: 10
        idle-timeout: 10m
        max-lifetime: 15m
    tenants:
      - company-cd: SKCC
        jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc:mysql://1.tcp.jp.ngrok.io:20789/midb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER:min}
        password: ${SKT_MI_DB_PASSWORD_MASTER:min}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 10
          idle-timeout: 10m
          max-lifetime: 15m
      - company-cd: SKT
        jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc:mysql://1.tcp.jp.ngrok.io:20789/midb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER:min}
        password: ${SKT_MI_DB_PASSWORD_MASTER:min}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 10
          idle-timeout: 10m
          max-lifetime: 15m
      - company-cd: midb
        jdbc-url: ${SKT_MI_DB_URL_MASTER:jdbc:mysql://1.tcp.jp.ngrok.io:20789/midb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${SKT_MI_DB_USERNAME_MASTER:min}
        password: ${SKT_MI_DB_PASSWORD_MASTER:min}
        hikari:
          connection-timeout: 7s
          maximum-pool-size: 10
          idle-timeout: 10m
          max-lifetime: 15m

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: bold-trout-35521.upstash.io
      port: 6379
      password: AYrBAAIjcDEzZmM2YTBkNWNmNzU0NTRjOTQzZmZhNGJiYjFkZjYxNnAxMA
      command-timeout: 10s

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${jwt.secret-key}
    saml2:
      relyingparty:
        registration:
          mi:
            entity-id: https://dev-mi.sk.com/saml/metadata
            acs:
              location: https://dev-mi.sk.com/login/saml2/sso/mi
              binding: POST
            singlelogout:
              url: https://dev-mi.sk.com/saml2/SingleLogout
            assertingparty:
              metadata-uri: classpath:saml/idp/n.gdisso.sk.com.metadata.xml
            signing:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
            decryption:
              credentials:
                - private-key-location: classpath:saml/sp/key/sp-private.key
                  certificate-location: classpath:saml/sp/key/sp-cert.crt
      login-callback-url: https://dev-mi.sk.com/callback
      login-error-url: https://dev-mi.sk.com/error

  web:
    resources:
      add-mappings: false

cache:
  redis:
    time-to-live: 3600s

jwt:
  secret-key: ${SKT_MI_JWT_SECRET_KEY:5a13e7a8276275ac76d7656dce0a4430f26d3c89d08174d7cd67968c0eb1beb5}
  access-token-expiry: 1000  # 10 hours (10h * 1000ms * 60s * 60m)
  refresh-token-expiry: 604800000  # 7 days (7d * 24h * 1000ms * 60s * 60m)

logging:
  config: classpath:logback-local.xml
  level:
    org.springframework.security.saml: TRACE
    org.springframework.security: TRACE
    org.springframework.boot.autoconfigure.security: TRACE
    org.springframework.context: DEBUG
