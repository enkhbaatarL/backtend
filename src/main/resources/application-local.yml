spring:
  config:
    activate:
      on-profile: local
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/mi?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: mingo
    password: mingo
    hikari:
      maximum-pool-size: 5
      maxLifeTime: 60000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${jwt.secret-key}
    saml2:
      relyingparty:
        registration:
          skt-user:
            entity-id: http://localhost:8080/saml2/service-provider-metadata/skt-user
            acs:
              location: http://localhost:8080/login/saml2/sso/skt-user
              binding: POST
            assertingparty:
              metadata-uri: https://dev-25395713.okta.com/app/exknog7293gkyVoqS5d7/sso/saml/metadata
          skt-admin:
            entity-id: http://localhost:8080/saml2/service-provider-metadata/skt-admin
            acs:
              location: http://localhost:8080/login/saml2/sso/skt-admin
              binding: POST
            assertingparty:
              metadata-uri: https://dev-25395713.okta.com/app/exknqq0r1bABpMTN55d7/sso/saml/metadata


jwt:
  secret-key: mysecretmysecretmysecretmysecretmysecretmysecretmysecretmysecretmysecret
  access-token-expiry: 36000000  # 10 hours (10h * 1000ms * 60s * 60m)
  refresh-token-expiry: 604800000  # 7 days (7d * 24h * 1000ms * 60s * 60m)


logging:
  config: classpath:logback-local.xml
  level:
      org.springframework.security: DEBUG

api:
  sample:
    url: http://localhost:8081
    connection-timeout: 1s
    read-timeout: 20s
