openapi: 3.1.0
info:
  title: Newsletter v2 API
  version: 1.0.0
  description: |
    Newsletter 편집본/리비전 API 단일 사용자 단독 편집 전제의 계약안.
    본 문서는 API 요청/응답 스키마의 Source of Truth이다.
    상태/전이/에러코드 원본: docs/newsletter-v2-design.md
    용어 표준:
    - revisionNo(정식) == rvsn_no(DB), revisionSeq(구문서 용어) 사용 금지
    - userNo(논리) == usr_no(DB 컬럼)
servers:
  - url: /api/v1/mi
    description: API base path

paths:
  /newsletter/{newsletterId}/{issueNo}/revisions/flow:
    get:
      tags: [Newsletter]
      summary: 리비전 저장/조회 플로우 요약
      description: |
        단일 사용자 전제의 프론트/클라이언트 협업 규칙 요약.
        - 최초 진입이나 직접 저장 호출에서 revisionId가 없어도 저장 가능.
        - 최초 저장 시 사용자-이슈 기준 리비전이 없으면 생성.
        - 상세조회 응답 `source`: `ORIGINAL`/`REVISION`, `hasDraft`: 임시저장 존재 여부.
        - 저장 요청 `revisionNo`: 선택값. 있으면 충돌 검사, 없으면 충돌 검사 생략.
        - `revisions/draft`는 임시저장, `revisions/save`는 최종저장.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      responses:
        '200':
          description: 플로우 규약 조회
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionFlowGuideRes'

  /newsletter/{newsletterId}/{issueNo}:
    get:
      tags: [Newsletter]
      summary: 원본 or 편집본 상세 조회
      description: |
        source 필드 기준으로 본문 타입을 판별한다. source가 REVISION이면 편집본, ORIGINAL이면 원본을 반환한다.
        최초 진입이 detail 호출이 아닐 경우에도 저장 API는 revisionId를 미사용해 동작한다.

        revisionId 규칙
        - revisionId는 사용자-이슈(1:1) 리비전 식별자이다.
        - 리비전이 생성된 경우에만 revisionId를 응답에 포함한다.
        - 클라이언트는 revisionId가 존재할 때 changes 이력 API(`/revisions/{revisionId}/changes*`) 호출에 사용한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionOrOriginalDetailRes'
              examples:
                originalWithNoRevision:
                  summary: 최초 진입/저장 전(리비전 없음)
                  description: |
                    originalSnapshot/latestSnapshot의 revisionNo=0은 원본 스냅샷 기준값(sentinel)이다.
                    리비전 저장 버전을 의미하지 않는다.
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      newsletterId: 12
                      issueNo: 1
                      revisionId: null
                      editStatus: NONE
                      revisionNo: null
                      source: ORIGINAL
                      hasDraft: false
                      latestDraftRevisionNo: null
                      content:
                        sections:
                          - id: sec-01
                            type: FIXED
                            title: 커버
                            order: 0
                            visibility: true
                            isCollapsed: false
                            blocks:
                              - id: blk-01
                                type: TITLE
                                format: GENERAL
                                title: 제목
                                order: 0
                                visibility: true
                                isCollapsed: false
                                plotOnChart: false
                                content:
                                  text: "금일 시장 브리핑"
                      originalSnapshot:
                        revisionNo: 0
                        data:
                          title: "금일 시장 브리핑"
                      latestSnapshot:
                        revisionNo: 0
                        data:
                          title: "금일 시장 브리핑"
                      deltaCount: 0
                      deltaChanges: []
                withRevision:
                  summary: 편집본 존재(수정본 리비전)
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      newsletterId: 12
                      issueNo: 1
                      revisionId: 203
                      editStatus: EDIT_DRAFT
                      revisionNo: 4
                      source: REVISION
                      hasDraft: true
                      latestDraftRevisionNo: 7
                      content:
                        sections:
                          - id: sec-01
                            type: GENERAL
                            title: 뉴스 개요
                            order: 0
                            visibility: true
                            isCollapsed: false
                            blocks:
                              - id: blk-01
                                type: TEXT
                                format: GENERAL
                                title: 요약
                                order: 0
                                visibility: true
                                isCollapsed: false
                                plotOnChart: false
                                content:
                                  text: "수정 반영됨"
                      originalSnapshot:
                        revisionNo: 1
                        data:
                          sections: []
                      latestSnapshot:
                        revisionNo: 4
                        data:
                          sections:
                            - id: sec-01
                              type: GENERAL
                      deltaCount: 3
                      deltaChanges:
                        - op: replace
                          path: /sections/0/title
                          value: "뉴스 개요"
                        - op: replace
                          path: /sections/0/blocks/0/content/text
                          value: "수정 반영됨"
                        - op: replace
                          path: /status
                          value: EDIT_DRAFT

  /newsletter/{newsletterId}/{issueNo}/revisions/{revisionId}/changes:
    get:
      tags: [Newsletter]
      summary: 수정 이력 목록 조회
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
        - name: revisionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 사용자별 1개 리비전 고정 ID
      responses:
        '200':
          description: 최근 이력 목록(최대 20건)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionListRes'

  /newsletter/{newsletterId}/{issueNo}/revisions/{revisionId}/changes/{seq}:
    get:
      tags: [Newsletter]
      summary: 특정 수정 이력 조회
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
        - name: revisionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 사용자별 1개 리비전 고정 ID
        - name: seq
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 구간 재생성 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionReplayRes'

  /newsletter/{newsletterId}/{issueNo}/revisions/draft:
    get:
      tags: [Newsletter]
      summary: 임시저장 최신본 조회
      description: |
        사용자-이슈 기준 최신 임시저장본(draft) 1건을 조회한다.
        (userNo, newsletterId, issueNo) 당 리비전 1개 정책으로 revisionId path 파라미터를 사용하지 않는다.
        반복 임시저장 시 기존 임시저장본을 덮어써 단일 최신본만 유지한다.
        임시저장본이 없으면 404 또는 적절한 리비전 오류로 응답한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionDraftRes'
              examples:
                autosaveExist:
                  summary: 임시저장본 조회
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      revisionNo: 8
                      revisionType: AUTOSAVE
                      updatedAt: "2026-03-06T09:15:00+09:00"
                      modifier: "user_01"
                      content:
                        sections:
                          - id: sec-01
                            type: GENERAL
                            title: 뉴스 개요
                            order: 0
                            visibility: true
                            isCollapsed: false
                            blocks:
                              - id: blk-01
                                type: TEXT
                                format: GENERAL
                                title: 요약
                                order: 0
                                visibility: true
                                isCollapsed: false
                                plotOnChart: false
                                content:
                                  text: "임시저장 반영"
        '404':
          description: 임시저장본 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseErrorResponse'

    put:
      tags: [Newsletter]
      summary: 임시저장
      description: |
        임시저장 저장.
        revisionId가 없는 상태라도 최초 호출 시 사용자-이슈 기준 리비전이 없으면 생성 후 저장한다.
        요청 파라미터 형식은 최종저장 API와 동일(`deltas`).
        revisionNo가 있으면 현재 revisionNo와 일치해야 하며 불일치 시 409.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionSaveReq'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionSaveRes'
              examples:
                draftCreated:
                  summary: draft 최초 생성/저장
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      revisionId: 203
                      revisionNo: 1
                      editStatus: EDIT_DRAFT
                      savedAt: null
                      lastAutoSavedAt: "2026-03-06T09:15:00+09:00"
                draftUpdated:
                  summary: draft 연속 저장
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      revisionId: 203
                      revisionNo: 2
                      editStatus: EDIT_DRAFT
                      savedAt: null
                      lastAutoSavedAt: "2026-03-06T09:20:00+09:00"
        '409':
          $ref: '#/components/responses/ConflictRevision'

  /newsletter/{newsletterId}/{issueNo}/revisions/save:
    put:
      tags: [Newsletter]
      summary: 최종저장
      description: |
        최종 저장. revisionId가 없는 상태라도 최초 호출 시 사용자-이슈 기준 리비전이 없으면 생성 후 EDIT_DRAFT->EDIT_SAVED 처리.
        EDIT_SAVED 상태 전환 후 send-mail 가능.
        요청 파라미터 형식은 임시저장 API와 동일(`deltas`).
        snapshotPayload가 있으면 snapshot을 저장하고, 없으면 snapshot 저장 없이 델타만 누적한다.
        권장 클라이언트 정책: 상세조회 deltaCount가 8 초과일 때 snapshotPayload 포함.
        운영 조정 범위: 6~10 (리플레이 p95 응답시간 기준).
        revisionNo가 있으면 현재 revisionNo와 일치해야 하며 불일치 시 409.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionSaveReq'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionSaveRes'
              examples:
                finalSaved:
                  summary: 최종저장(리비전 미존재 생성)
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      revisionId: 203
                      revisionNo: 1
                      editStatus: EDIT_SAVED
                      savedAt: "2026-03-06T09:25:00+09:00"
                      lastAutoSavedAt: "2026-03-06T09:20:00+09:00"
                finalSavedWithSnapshot:
                  summary: 최종저장(스냅샷 동반)
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      revisionId: 203
                      revisionNo: 3
                      editStatus: EDIT_SAVED
                      savedAt: "2026-03-06T09:30:00+09:00"
                      lastAutoSavedAt: "2026-03-06T09:20:00+09:00"
                      snapshotSaved: true
        '409':
          $ref: '#/components/responses/ConflictRevision'

  /newsletter/{newsletterId}/{issueNo}/send-mail:
    post:
      tags: [Newsletter]
      summary: 편집본 메일 발송
      description: |
        리비전 기준 send-mail. EDIT_SAVED 상태에서만 허용.
        recipientEmails 미입력은 유효 주소 0개로 처리한다.
        recipientEmails 전달 시 유효한 이메일만 추출해 사용하고, 유효 주소가 1개도 없으면 INVALID_RECIPIENT_EMAIL로 400.
        요청 본문은 multipart/form-data의 flat field(`subject`, `htmlBody`, `recipientEmails`, `scheduledAt`)와 `images` 파일 파트로 전달한다.
        JSON `request` 파트는 사용하지 않는다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                subject:
                  type: string
                htmlBody:
                  type: string
                  description: HTML 본문
                recipientEmails:
                  type: array
                  items:
                    type: string
                    format: email
                  description: 반복 키로 전달되는 수신자 목록
                  nullable: true
                scheduledAt:
                  type: string
                  description: 예약 발송 시각(ISO-8601). 과거/현재 또는 미입력은 즉시 발송, 미래 시각은 예약 발송 대상으로 처리
                  example: "2026-03-07T10:30:00+09:00"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 인라인 첨부 이미지 목록
              required: [subject, htmlBody]
      responses:
        '200':
          description: 발송 요청 수락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseString'
        '400':
          description: 수신자 이메일 유효성 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseErrorResponse'
        '422':
          description: 상태 가드 위반
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseErrorResponse'

components:
  parameters:
    NewsletterId:
      name: newsletterId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    IssueNo:
      name: issueNo
      in: path
      required: true
      schema:
        type: integer
        format: int32

  schemas:
    BaseResponse:
      type: object
      properties:
        status:
          type: boolean
          description: 결과 성공 여부
        code:
          type: string
          description: "ResultCode (예: SUC-000, REQ-003)"
        message:
          type: string
          description: 결과 메시지
        data:
          nullable: true
          description: 실제 응답 데이터
      required: [status, code, message]

    BaseErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
              description: 에러 상세(없을 수 있음)
      example:
        status: false
        code: REQ-003
        message: One or more parameters are invalid.
        data: null

    BaseResponseRevisionFlowGuideRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionFlowGuideRes'

    BaseResponseRevisionOrOriginalDetailRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionOrOriginalDetailRes'

    BaseResponseRevisionListRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionListRes'

    BaseResponseRevisionReplayRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionReplayRes'

    BaseResponseRevisionDraftRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionDraftRes'

    BaseResponseRevisionSaveRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionSaveRes'

    BaseResponseString:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              nullable: true

    RevisionOrOriginalDetailRes:
      type: object
      properties:
        newsletterId:
          type: integer
        issueNo:
          type: integer
        revisionId:
          type: integer
          nullable: true
          description: 사용자별 리비전 ID (리비전이 없으면 null)
        editStatus:
          type: string
          enum: [NONE, EDIT_DRAFT, EDIT_SAVED]
        revisionNo:
          type: integer
          nullable: true
          description: 마지막 반영 revisionNo (낙관적 락용). 최초 저장 전이면 null.
        source:
          type: string
          enum: [ORIGINAL, REVISION]
          description: 현재 상세조회에서 실제 반환된 본문 유형
        hasDraft:
          type: boolean
          description: 임시저장 이력 존재 여부
        latestDraftRevisionNo:
          type: integer
          nullable: true
          description: hasDraft가 true일 때 조회 대상 draft revisionNo
        content:
          type: object
          additionalProperties: true
        originalSnapshot:
          $ref: '#/components/schemas/ContentSnapshot'
        latestSnapshot:
          $ref: '#/components/schemas/ContentSnapshot'
        deltaCount:
          type: integer
          description: latestSnapshot 대비 deltaChanges 건수. 권장 snapshot cut 임계치 초기값은 8.
        deltaChanges:
          type: array
          description: latestSnapshot 대비 현재 콘텐츠 변경점
          items:
            $ref: '#/components/schemas/JsonPatchOp'

    RevisionItem:
      type: object
      properties:
        seq:
          type: integer
          description: 이력 시퀀스
        revisionType:
          type: string
          enum: [AUTOSAVE, FINAL]
        updatedAt:
          type: string
          format: date-time
        modifier:
          type: string
      required: [seq, updatedAt]

    RevisionListRes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RevisionItem'
        hasNext:
          type: boolean
        nextCursor:
          type: integer
          nullable: true

    RevisionReplayRes:
      type: object
      properties:
        baseSnapshot:
          type: object
          description: baseSnapshot.data 포함
          properties:
            seq:
              type: integer
            data:
              type: object
              additionalProperties: true
        fromSeq:
          type: integer
        toSeq:
          type: integer
        histories:
          type: array
          items:
            $ref: '#/components/schemas/DeltaItem'
      required: [baseSnapshot, fromSeq, toSeq, histories]

    RevisionDraftRes:
      type: object
      properties:
        revisionNo:
          type: integer
        content:
          type: object
          additionalProperties: true
        revisionType:
          type: string
          enum: [AUTOSAVE]
        updatedAt:
          type: string
          format: date-time
        modifier:
          type: string
      required: [revisionNo, content, updatedAt]

    DeltaItem:
      type: object
      properties:
        seq:
          type: integer
        deltas:
          type: array
          items:
            $ref: '#/components/schemas/JsonPatchOp'

    JsonPatchOp:
      type: object
      properties:
        op:
          type: string
        path:
          type: string
        value:
          type: object
          nullable: true
      required: [op, path]

    RevisionSaveReq:
      type: object
      description: |
        revisionNo는 선택값. 최초 생성시 생략 가능.
        기존 리비전 존재 시 revisionNo가 있으면 현재 revisionNo와 일치해야 하며 불일치 시 409.
        revisionNo가 없으면 충돌 검사를 수행하지 않는다.
      properties:
        revisionNo:
          type: integer
          nullable: true
        deltas:
          type: array
          description: |
            변경분(PATCH). 클라이언트의 누적 diff 전송값.
          items:
            $ref: '#/components/schemas/JsonPatchOp'
        snapshotPayload:
          type: object
          nullable: true
          description: |
            최종 저장 시점의 스냅샷 갱신 요청용 데이터.
            값이 전달되면 백엔드가 새 스냅샷을 저장한다.
            미전송 시 snapshot 저장 없음.
            권장 전달 기준: 상세조회 deltaCount > 8.
          additionalProperties: true
      required: []

    ContentSnapshot:
      type: object
      properties:
        revisionNo:
          type: integer
          description: |
            스냅샷 기준 revisionNo.
            원본 스냅샷 기준값은 0(sentinel)이며, 리비전 저장 버전값은 1 이상이다.
        data:
          type: object
          additionalProperties: true

    RevisionSaveRes:
      type: object
      properties:
        revisionId:
          type: integer
          format: int64
        revisionNo:
          type: integer
        editStatus:
          type: string
          enum: [EDIT_DRAFT, EDIT_SAVED]
        savedAt:
          type: string
          format: date-time
          nullable: true
        lastAutoSavedAt:
          type: string
          format: date-time
          nullable: true
        snapshotSaved:
          type: boolean
          description: snapshotPayload가 전달되어 스냅샷이 저장된 경우 true

    RevisionFlowGuideRes:
      type: object
      properties:
        scenario:
          type: string
          enum:
            - EDIT_DRAFT
            - EDIT_SAVED
        hasRevisionFallback:
          type: boolean
          description: revisionId가 없어도 draft/save 처리 가능 여부
        endpoints:
          type: object
          properties:
            draft:
              type: object
              properties:
                request:
                  type: string
                createIfMissing:
                  type: boolean
                conflictRule:
                  type: string
            save:
              type: object
              properties:
                request:
                  type: string
                createIfMissing:
                  type: boolean
                transitionTo:
                  type: string
            draftLoad:
              type: object
              properties:
                request:
                  type: string
                note:
                  type: string
            history:
              type: object
              properties:
                list:
                  type: string
                detail:
                  type: string
            sendMail:
              type: object
              properties:
                request:
                  type: string
                guard:
                  type: string

  responses:
    ConflictRevision:
      description: 버전 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseErrorResponse'
          examples:
            conflict:
              value:
                status: false
                code: BIZ-001
                message: REVISION_VERSION_CONFLICT
                data: null
