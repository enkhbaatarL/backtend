openapi: 3.1.0
info:
  title: Newsletter v2 API
  version: 1.1.0
  description: |
    Newsletter v2 API의 현재 controller 기준 OpenAPI 문서.
    본 문서는 `/api/v1/mi/newsletter` 하위의 v2 상세/리비전/메일/구독/preview endpoint를 다룬다.

    Sync note:
    - synced at: 2026-03-23
    - synced against:
      - `MiNewsletterDedicatedController`
      - `MiNewsletterRevisionController`
      - `MiNewsletterSnapshotController`
      - `MiNewsletterMailController`
      - `MiNewsletterSubscriptionController`
      - `MiNewsletterTriggerController`

    Source of Truth:
    - 상태/전이 원본: `docs/newsletter-v2-design.md`
    - snapshot 응답 shape 원본: `docs/newsletter-snapshot-section-fields-api-contract.md`
    - 본 문서는 controller path/method 및 request/response DTO를 기준으로 동기화한다.
servers:
  - url: /api/v1/mi
    description: API base path

tags:
  - name: Newsletter
    description: Newsletter v2 API

paths:
  /newsletter/{newsletterId}/{issueNo}:
    get:
      tags: [Newsletter]
      summary: 뉴스레터 상세 v2 조회
      description: |
        요청 `companyNo`로 접근 가능한 발행본을 먼저 확인한 뒤,
        actor user 소유 revision이 있으면 revision 기준 최신 snapshot을,
        없으면 original snapshot 기준 최신 본문을 반환한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
        - $ref: '#/components/parameters/CompanyNo'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseNewsletterDetailV2Res'
              examples:
                original:
                  summary: revision 없는 상세 응답
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      newsletterId: 12
                      issueNo: 1
                      publishedAt: "2026-03-23T09:00:00"
                      subscribed: false
                      revision: null
                      snapshot:
                        revisionNo: 0
                        savedAt: "2026-03-23T09:00:00"
                        data:
                          sections:
                            - id: sec-NEWS_FLOW
                              type: GENERAL
                              name: NEWS_FLOW
                              order: 5
                              visibility: true
                              fields:
                                title: 주요 뉴스 Flow 및 Brent 유가 추이
                                aggregationTime: 뉴욕시간 전일 20:00부터 당일 17:00까지
                              fieldDefs:
                                title:
                                  editable: true
                                  required: true
                                aggregationTime:
                                  editable: true
                                  required: true
                              blocks:
                                - id: blk-NEWS_FLOW_CHART-10
                                  type: CHART
                                  format: LINE
                                  order: 1
                                  visibility: true
                                  content:
                                    timestamps: [1742670000000, 1742742000000]
                                    series: []
                      deltaCount: 0
                      deltaChanges: []
                revision:
                  summary: revision 존재 응답
                  value:
                    status: true
                    code: SUC-000
                    message: Success.
                    data:
                      newsletterId: 12
                      issueNo: 1
                      publishedAt: "2026-03-23T09:00:00"
                      subscribed: true
                      revision:
                        revisionId: 203
                        editStatus: EDIT_DRAFT
                        currentRevisionNo: 4
                        hasDraft: true
                        draftRevisionNo: 4
                      snapshot:
                        revisionNo: 4
                        savedAt: "2026-03-23T10:10:00"
                        data:
                          sections:
                            - id: sec-NEWS_FLOW
                              type: GENERAL
                              name: NEWS_FLOW
                              order: 5
                              visibility: true
                              fields:
                                title: 수정된 제목
                                aggregationTime: 뉴욕시간 전일 20:00부터 당일 17:00까지
                              fieldDefs:
                                title:
                                  editable: true
                                  required: true
                                aggregationTime:
                                  editable: true
                                  required: true
                              blocks: []
                      deltaCount: 2
                      deltaChanges:
                        - op: replace
                          path: /sections/0/fields/title
                          value: 수정된 제목

  /newsletter/{newsletterId}/{issueNo}/original-snapshot:
    get:
      tags: [Newsletter]
      summary: 뉴스레터 original snapshot 조회
      description: 요청 `companyNo` 기준으로 접근 가능한 published issue의 `org_snpsht_json` 원본 스냅샷만 그대로 반환한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
        - $ref: '#/components/parameters/CompanyNo'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseNewsletterIssueOriginalSnapshotRes'

  /newsletter/publish-histories/{publishHistoryId}/snapshot:
    get:
      tags: [Newsletter]
      summary: 뉴스레터 preview snapshot 조회
      description: publishHistory에 고정된 템플릿 버전 기준으로 preview snapshot을 동적으로 조립한다.
      parameters:
        - $ref: '#/components/parameters/PublishHistoryId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseNewsletterIssuePreviewRes'

  /newsletter/{newsletterId}/{issueNo}/revisions/flow:
    get:
      tags: [Newsletter]
      summary: 리비전 저장/조회 플로우 요약
      description: |
        단일 사용자 편집 전제의 프론트/클라이언트 협업 규칙 요약.
        이 endpoint는 '!dedicated' profile에서만 노출된다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionFlowGuideRes'

  /newsletter/{newsletterId}/{issueNo}/revisions/{revisionId}/changes:
    get:
      tags: [Newsletter]
      summary: 수정 이력 목록 조회
      description: "'!dedicated' profile에서만 노출된다."
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionListRes'

  /newsletter/{newsletterId}/{issueNo}/revisions/{revisionId}/changes/{seq}:
    get:
      tags: [Newsletter]
      summary: 특정 수정 이력 조회
      description: "'!dedicated' profile에서만 노출된다."
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/RevisionSeq'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionReplayRes'

  /newsletter/{newsletterId}/{issueNo}/revisions/draft:
    get:
      tags: [Newsletter]
      summary: 임시저장 최신본 조회
      description: "사용자-이슈 기준 최신 임시저장본 1건을 조회한다. '!dedicated' profile에서만 노출된다."
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionDraftRes'
        '404':
          description: draft 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseErrorResponse'
    put:
      tags: [Newsletter]
      summary: 임시저장
      description: |
        revision이 없으면 최초 호출 시 자동 생성 후 저장한다.
        '!dedicated' profile에서만 노출된다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionSaveReq'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionSaveRes'
        '409':
          $ref: '#/components/responses/ConflictRevision'

  /newsletter/{newsletterId}/{issueNo}/revisions/save:
    put:
      tags: [Newsletter]
      summary: 최종저장
      description: |
        revision이 없으면 최초 호출 시 자동 생성 후 저장한다.
        `snapshotPayload`가 있을 때만 revision snapshot 저장을 수행한다.
        '!dedicated' profile에서만 노출된다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionSaveReq'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseRevisionSaveRes'
        '409':
          $ref: '#/components/responses/ConflictRevision'

  /newsletter/{newsletterId}/{issueNo}/send-mail:
    post:
      tags: [Newsletter]
      summary: 편집본 메일 발송
      description: |
        리비전 저장본 메일을 발송한다.
        요청은 `multipart/form-data`이며, flat field는 `NewsletterMailSendReq`, 파일 파트는 `images`를 사용한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsletterMailSendMultipartReq'
      responses:
        '200':
          description: 발송 요청 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseString'

  /newsletter/{newsletterId}/{issueNo}/trigger-mail:
    post:
      tags: [Newsletter]
      summary: 뉴스레터 메일 발송 트리거
      description: |
        Airflow DAG 등 외부 시스템이 발행 완료 후 호출한다.
        차트 캡처 + 구독자 메일 발송을 비동기로 시작하고 즉시 `202 Accepted`를 반환한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
        - $ref: '#/components/parameters/IssueNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterMailTriggerReq'
      responses:
        '202':
          description: 비동기 발송 시작
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseString'

  /newsletter/{newsletterId}/subscription:
    put:
      tags: [Newsletter]
      summary: 뉴스레터 구독
      description: 현재 사용자를 뉴스레터 구독 상태로 변경한다. 멱등하게 동작한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
      responses:
        '200':
          description: 구독 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseNewsletterSubscriptionRes'
    delete:
      tags: [Newsletter]
      summary: 뉴스레터 구독 해지
      description: 현재 사용자를 뉴스레터 미구독 상태로 변경한다. 멱등하게 동작한다.
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
      responses:
        '200':
          description: 구독 해지 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseNewsletterSubscriptionRes'
    get:
      tags: [Newsletter]
      summary: 내 뉴스레터 구독 상태 조회
      parameters:
        - $ref: '#/components/parameters/NewsletterId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponseNewsletterSubscriptionRes'

components:
  parameters:
    NewsletterId:
      name: newsletterId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    IssueNo:
      name: issueNo
      in: path
      required: true
      schema:
        type: integer
        format: int32
    CompanyNo:
      name: companyNo
      in: query
      required: true
      description: 접근 제어와 tenant resolution에 사용하는 요청 고객회사번호
      schema:
        type: integer
        format: int32
    PublishHistoryId:
      name: publishHistoryId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: 사용자별 1개 revision의 식별자
      schema:
        type: integer
        format: int64
    RevisionSeq:
      name: seq
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    BaseResponse:
      type: object
      properties:
        status:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
      required: [status, code, message]

    BaseErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true

    BaseResponseString:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              nullable: true

    BaseResponseNewsletterDetailV2Res:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NewsletterDetailV2Res'

    BaseResponseNewsletterIssueOriginalSnapshotRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NewsletterIssueOriginalSnapshotRes'

    BaseResponseNewsletterIssuePreviewRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NewsletterIssuePreviewRes'

    BaseResponseRevisionFlowGuideRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionFlowGuideRes'

    BaseResponseRevisionListRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionListRes'

    BaseResponseRevisionReplayRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionReplayRes'

    BaseResponseRevisionDraftRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionDraftRes'

    BaseResponseRevisionSaveRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RevisionSaveRes'

    BaseResponseNewsletterSubscriptionRes:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NewsletterSubscriptionRes'

    NewsletterDetailV2Res:
      type: object
      properties:
        newsletterId:
          type: integer
        issueNo:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        subscribed:
          type: boolean
          nullable: true
        revision:
          $ref: '#/components/schemas/RevisionStateRes'
        snapshot:
          $ref: '#/components/schemas/ContentSnapshotRes'
        deltaCount:
          type: integer
          nullable: true
        deltaChanges:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/JsonPatchOpRes'
      required: [newsletterId, issueNo, snapshot]

    RevisionStateRes:
      type: object
      nullable: true
      properties:
        revisionId:
          type: integer
          format: int64
        editStatus:
          type: string
        currentRevisionNo:
          type: integer
          nullable: true
        hasDraft:
          type: boolean
        draftRevisionNo:
          type: integer
          nullable: true

    ContentSnapshotRes:
      type: object
      properties:
        revisionNo:
          type: integer
          nullable: true
        data:
          $ref: '#/components/schemas/SnapshotRoot'
        savedAt:
          type: string
          format: date-time
          nullable: true

    NewsletterIssueOriginalSnapshotRes:
      type: object
      properties:
        newsletterId:
          type: integer
        issueNo:
          type: integer
        source:
          type: string
        snapshot:
          $ref: '#/components/schemas/SnapshotRoot'
      required: [newsletterId, issueNo, source, snapshot]

    NewsletterIssuePreviewRes:
      type: object
      properties:
        newsletterId:
          type: integer
        issueNo:
          type: integer
        snapshot:
          $ref: '#/components/schemas/SnapshotRoot'
      required: [newsletterId, issueNo, snapshot]

    NewsletterSubscriptionRes:
      type: object
      properties:
        newsletterId:
          type: string
        subscribed:
          type: boolean
        subscribedAt:
          type: string
          format: date-time
          nullable: true
        unsubscribedAt:
          type: string
          format: date-time
          nullable: true
      required: [newsletterId, subscribed]

    RevisionFlowGuideRes:
      type: object
      properties:
        scenario:
          type: string
        hasRevisionFallback:
          type: boolean
        endpoints:
          type: object
          properties:
            draft:
              $ref: '#/components/schemas/RevisionFlowDraftEndpoint'
            save:
              $ref: '#/components/schemas/RevisionFlowSaveEndpoint'
            draftLoad:
              $ref: '#/components/schemas/RevisionFlowDraftLoadEndpoint'
            history:
              $ref: '#/components/schemas/RevisionFlowHistoryEndpoint'
            sendMail:
              $ref: '#/components/schemas/RevisionFlowSendMailEndpoint'

    RevisionFlowDraftEndpoint:
      type: object
      properties:
        request:
          type: string
        createIfMissing:
          type: boolean
        conflictRule:
          type: string

    RevisionFlowSaveEndpoint:
      type: object
      properties:
        request:
          type: string
        createIfMissing:
          type: boolean
        transitionTo:
          type: string

    RevisionFlowDraftLoadEndpoint:
      type: object
      properties:
        request:
          type: string
        note:
          type: string

    RevisionFlowHistoryEndpoint:
      type: object
      properties:
        list:
          type: string
        detail:
          type: string

    RevisionFlowSendMailEndpoint:
      type: object
      properties:
        request:
          type: string
        guard:
          type: string

    RevisionListRes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RevisionItemRes'
        hasNext:
          type: boolean
        nextCursor:
          type: integer
          format: int64
          nullable: true

    RevisionItemRes:
      type: object
      properties:
        seq:
          type: integer
          format: int64
        revisionType:
          type: string
        updatedAt:
          type: string
          format: date-time
        modifier:
          type: string
          nullable: true

    RevisionReplayRes:
      type: object
      properties:
        baseSnapshot:
          $ref: '#/components/schemas/RevisionReplayBaseSnapshot'
        fromSeq:
          type: integer
          format: int64
        toSeq:
          type: integer
          format: int64
        histories:
          type: array
          items:
            $ref: '#/components/schemas/DeltaItemRes'
      required: [baseSnapshot, fromSeq, toSeq, histories]

    RevisionReplayBaseSnapshot:
      type: object
      properties:
        seq:
          type: integer
          format: int64
        data:
          $ref: '#/components/schemas/SnapshotRoot'

    RevisionDraftRes:
      type: object
      properties:
        revisionNo:
          type: integer
        content:
          $ref: '#/components/schemas/SnapshotRoot'
        revisionType:
          type: string
        updatedAt:
          type: string
          format: date-time
        modifier:
          type: string
          nullable: true
      required: [revisionNo, content, revisionType, updatedAt]

    RevisionSaveReq:
      type: object
      properties:
        revisionNo:
          type: integer
          nullable: true
        deltas:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/JsonPatchOpReq'
        snapshotPayload:
          $ref: '#/components/schemas/SnapshotRoot'

    RevisionSaveRes:
      type: object
      properties:
        revisionId:
          type: integer
          format: int64
        revisionNo:
          type: integer
        editStatus:
          type: string
        savedAt:
          type: string
          format: date-time
          nullable: true
        lastAutoSavedAt:
          type: string
          format: date-time
          nullable: true
        snapshotSaved:
          type: boolean
          nullable: true

    DeltaItemRes:
      type: object
      properties:
        seq:
          type: integer
          format: int64
        deltas:
          type: array
          items:
            $ref: '#/components/schemas/JsonPatchOpRes'

    JsonPatchOpReq:
      type: object
      properties:
        op:
          type: string
        path:
          type: string
        value:
          nullable: true
      required: [op, path]

    JsonPatchOpRes:
      type: object
      properties:
        op:
          type: string
        path:
          type: string
        value:
          nullable: true
      required: [op, path]

    NewsletterMailSendMultipartReq:
      type: object
      properties:
        subject:
          type: string
        htmlBody:
          type: string
        recipientEmails:
          type: array
          nullable: true
          items:
            type: string
            format: email
        scheduledAt:
          type: string
          nullable: true
          description: 예약 발송 시각(ISO-8601 string)
        images:
          type: array
          nullable: true
          items:
            type: string
            format: binary
      required: [subject, htmlBody]

    NewsletterMailTriggerReq:
      type: object
      properties:
        subject:
          type: string
      required: [subject]

    SnapshotRoot:
      type: object
      properties:
        meta:
          type: object
          nullable: true
          additionalProperties: true
        sections:
          type: array
          items:
